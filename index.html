<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ферма</title>
<meta name="theme-color" content="#4F8A3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ферма">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: full-bleed game canvas; quest card top-left, bag top-right, dialog sheet bottom, modals centered */
:root{
  --grass-deep:#4F8A3A;
  --wood:#5B3A1E;
  --paper:#FFFDF4;
  --ink:#2E2418;
  --muted:#7A6A55;
  --tomato:#E2553A;
  --leaf:#3E8E41;
  --sky:#4DA3D9;
  --straw:#E9C77B;
  --display:"Fredoka","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--grass-deep);color:var(--ink);font-family:var(--body);font-size:17px;overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#game{position:absolute;inset:0}
#game canvas{display:block;touch-action:none}

.hud{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.quest{background:var(--paper);border:3px solid var(--wood);border-radius:14px;padding:8px 14px 10px;max-width:min(340px,64vw);
  box-shadow:0 4px 0 rgba(46,36,24,.35);display:flex;flex-direction:column;gap:2px}
.quest .label{font-size:15px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tomato)}
.quest .text{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.2;text-wrap:balance}
.quest .sub{margin-top:6px;padding-top:6px;border-top:2px dashed #D9CBA8;font-family:var(--display);font-size:17px;font-weight:600;line-height:1.2;color:#3E5A7A}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}
.bag{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--wood);border-radius:999px;padding:3px 12px 3px 6px;
  font-weight:800;font-size:16px;box-shadow:0 2px 0 rgba(46,36,24,.3);animation:pop .35s ease-out}
.chip i{width:20px;height:20px;border-radius:50%;border:2px solid var(--wood);display:block}
.ghost-btn{font-family:var(--body);font-weight:800;font-size:16px;color:var(--ink);background:rgba(255,253,244,.85);border:2px solid var(--wood);
  border-radius:999px;padding:5px 12px;cursor:pointer}
.ghost-btn:focus-visible,.btn:focus-visible,.nest:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

.guide{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;
  background:var(--tomato);border:3px solid var(--wood);border-radius:50%;display:grid;place-items:center;box-shadow:0 3px 0 rgba(46,36,24,.35)}
.guide span{display:block;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:13px solid #fff;margin-left:3px}

.toast{position:absolute;left:50%;top:118px;transform:translate(-50%,-8px);max-width:calc(100% - 32px);text-align:center;
  background:var(--leaf);color:#fff;font-family:var(--display);font-weight:600;font-size:19px;padding:9px 18px;border-radius:14px;
  border:3px solid var(--wood);box-shadow:0 4px 0 rgba(46,36,24,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.info{background:var(--paper);color:var(--ink)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.sheet{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:10px;
  margin-inline:auto;max-width:640px;background:var(--paper);border:3px solid var(--wood);border-radius:18px;padding:14px 16px;
  display:flex;gap:14px;align-items:flex-start;box-shadow:0 5px 0 rgba(46,36,24,.4);cursor:pointer;animation:rise .25s ease-out}
.portrait{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;
  font-size:30px;color:#fff;border:3px solid var(--wood)}
.say{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.who{font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted)}
.line{font-size:18px;line-height:1.4;min-height:2.8em}
.actions{display:flex;justify-content:flex-end;gap:8px}
.btn{font-family:var(--display);font-size:18px;font-weight:600;background:var(--tomato);color:#fff;border:3px solid var(--wood);
  border-radius:12px;padding:8px 18px;box-shadow:0 3px 0 var(--wood);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood)}
.btn.secondary{background:var(--paper);color:var(--ink)}
/* Окно мыслей героини: светлее, пунктирная рамка, курсив */
.sheet.thought{background:#F1F6FA;border-style:dashed;border-color:#5C7A93}
.sheet.thought .line{font-style:italic;color:#34465A}
.sheet.thought .portrait{border-style:dashed}
/* Выбор вариантов в разговоре */
.actions.choices{flex-direction:column;align-items:stretch}
.actions.choices .btn{font-size:17px;text-align:left}

.modal{position:absolute;inset:0;background:rgba(28,40,18,.55);display:grid;place-items:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);border:3px solid var(--wood);border-radius:20px;padding:18px;width:min(420px,100%);
  display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 6px 0 rgba(46,36,24,.45);animation:pop .3s ease-out;
  max-height:100%;overflow:auto}
.card h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0;text-wrap:balance}
.card p{margin:0;line-height:1.45;font-size:17px}
.badge{align-self:center;font-size:15px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tomato)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mg-stats{display:flex;justify-content:space-between;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:999px;background:#EADFC8;border:2px solid var(--wood);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .2s}
.nests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;width:100%;margin-inline:auto}
.nest{position:relative;aspect-ratio:1;border-radius:50%;padding:0;cursor:pointer;border:3px solid var(--wood);
  background:radial-gradient(circle at 50% 60%,#8A5A33 0 34%,var(--straw) 36% 100%)}
.nest .egg{position:absolute;left:50%;top:50%;width:40%;height:50%;transform:translate(-50%,-58%) scale(0);
  background:#FFF6E3;border:3px solid #C9A46B;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transition:transform .14s ease-out}
.nest.has .egg{transform:translate(-50%,-58%) scale(1)}
.nest.gold .egg{background:#FFD447;border-color:#C79A12}

.info{display:flex;flex-direction:column;gap:12px}

/* Джойстик и кнопка действия */
.stick-zone{position:absolute;inset:0;touch-action:none}
.stick{position:absolute;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
  background:rgba(255,253,244,.22);border:3px solid rgba(255,253,244,.75);pointer-events:none;transition:opacity .2s}
.stick.idle{opacity:.4}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:var(--paper);border:3px solid var(--wood);box-shadow:0 3px 0 rgba(46,36,24,.35)}
/* Облачко действия над персонажем или предметом */
.bubble{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--display);font-weight:600;font-size:18px;color:#fff;
  background:var(--tomato);border:3px solid var(--wood);border-radius:14px;padding:8px 16px;box-shadow:0 3px 0 var(--wood);cursor:pointer}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--wood);border-bottom:0}
.bubble:active{box-shadow:0 1px 0 var(--wood);background:#C9472F}
.bubble:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.off{visibility:hidden}
body.in-barn .quest{display:none}   /* в амбаре плашка задания не закрывает угол с ящиком; подсказки — всплывашками */
body.overview .hud, body.overview .stick-zone, body.overview .guide, body.overview .toast, body.overview .bubble, body.overview .rotate{display:none!important}

/* Просьба повернуть телефон */
.rotate{position:absolute;inset:0;z-index:10;display:none;place-items:center;align-content:center;gap:16px;text-align:center;
  background:var(--grass-deep);color:#fff;padding:24px;font-family:var(--display);font-weight:600;font-size:22px}
.rotate .phone{width:52px;height:88px;border:4px solid #fff;border-radius:12px;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@media (orientation:landscape) and (pointer:coarse) and (max-height:600px){.rotate{display:grid}}

/* Горизонтальный телефон: невысокий экран */
@media (max-height:500px){
  .card.mg{width:min(680px,100%);display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;text-align:left}
  .card.mg .badge{align-self:flex-start}
  .card.mg .nests{width:min(280px,62vh)}
  .card.mg .row{justify-content:flex-start}
  .toast{top:96px}
  /* рубка дров на невысоком экране: всё в одну колонку, чурбак меньше, без пояснения */
  .card.mg.chop{display:flex;flex-direction:column;align-items:stretch;width:min(520px,100%);gap:6px;padding:10px 16px;text-align:center}
  .card.mg.chop p{display:none}
  .card.mg.chop .badge{align-self:center}
  .card.mg.chop h2{font-size:22px}
  .chop-scene{height:96px;transform:scale(.62);transform-origin:50% 100%;margin-top:-10px}
  .card.mg.chop .row{justify-content:center}
}

/* Затемнение экрана при смене дня */
.fade{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:#141826;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
.fade.show{opacity:1;pointer-events:auto}
.fade-text{font-family:var(--display);font-weight:600;font-size:46px;color:#FFF3D6;letter-spacing:.02em;opacity:0;transition:opacity .8s ease .4s}
.fade.show .fade-text{opacity:1}

.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--grass-deep);color:#fff;font-family:var(--display);font-size:22px}

/* Мини-игра «Рубка дров» */
.chop-scene{position:relative;height:170px;width:240px;margin:0 auto}
.stump{position:absolute;left:50%;bottom:4px;width:160px;height:58px;margin-left:-80px;border-radius:50%;border:3px solid var(--wood);
  background:radial-gradient(ellipse at 50% 40%,#D2A574 0 22%,#B9875A 23% 30%,#D2A574 31% 46%,#B9875A 47% 54%,#8A5A33 55%)}
.log{position:absolute;left:50%;bottom:36px;width:96px;height:104px;margin-left:-48px}
.log .h{position:absolute;top:14px;bottom:0;width:50%;background:linear-gradient(90deg,#9C6B3E,#C18D57 45%,#A8754A);border:3px solid var(--wood);
  transition:transform .4s cubic-bezier(.2,.8,.3,1)}
.log .h.l{left:0;border-right:none;border-radius:10px 0 0 10px}
.log .h.r{right:0;border-left:none;border-radius:0 10px 10px 0}
.log .top{position:absolute;left:-1px;right:-1px;top:0;height:30px;border-radius:50%;border:3px solid var(--wood);
  background:radial-gradient(ellipse,#F0CC95 0 18%,#D8AE76 19% 30%,#F0CC95 31% 52%,#D8AE76 53% 64%,#E9C189 65%);transition:opacity .2s}
.log.knot .h.l::after{content:"";position:absolute;left:12px;top:34px;width:16px;height:12px;border-radius:50%;background:#6B4424;border:2px solid #4A2E17}
.log.crack .top::after{content:"";position:absolute;left:50%;top:2px;bottom:2px;width:3px;margin-left:-1px;background:#4A2E17}
.log.split .top{opacity:0}
.log.split .h.l{transform:translate(-62px,18px) rotate(-24deg)}
.log.split .h.r{transform:translate(62px,18px) rotate(24deg)}
.log.stuck{animation:wobble .35s ease-in-out}
.axe{position:absolute;left:50%;top:-30px;font-size:40px;margin-left:-6px;transform:rotate(-20deg);opacity:0;transition:opacity .15s}
.log.stuck .axe{opacity:1}
@keyframes wobble{0%,100%{transform:none}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.chop-bar{position:relative;height:30px;border:3px solid var(--wood);border-radius:999px;background:#EADFC8;overflow:hidden}
.chop-bar .zone{position:absolute;top:0;bottom:0;background:#86C46F;border-left:2px solid #4F8A3A;border-right:2px solid #4F8A3A}
.chop-bar .mark{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--ink);border-radius:3px}
.chop-msg{min-height:1.45em;font-family:var(--display);font-weight:600;font-size:19px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="game"></div>
  <div class="stick-zone" id="stickZone"><div class="stick idle" id="stick"><div class="knob" id="knob"></div></div></div>
  <div class="hud">
    <div class="quest"><div class="label" id="questLabel">Задание</div><div class="text" id="questText"></div><div class="sub" id="sideQuest" hidden></div></div>
    <div class="side"><button class="ghost-btn" id="resetBtn" type="button">Заново</button><button class="ghost-btn" id="skipBtn" type="button" hidden>Пропустить квест</button><button class="ghost-btn" id="barnBtn" type="button">Перейти к амбару</button><div class="bag" id="bag"></div></div>
  </div>
  <button class="bubble" id="bubble" type="button" hidden></button>
  <div class="guide" id="guide" hidden><span></span></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sheet" id="sheet" hidden>
    <div class="portrait" id="portrait"></div>
    <div class="say">
      <div class="who" id="who"></div>
      <div class="line" id="line"></div>
      <div class="actions"><button class="btn" id="nextBtn" type="button">Дальше</button></div>
    </div>
  </div>
  <div class="modal" id="modal" hidden></div>
  <div class="fade" id="fade"><div class="fade-text" id="fadeText"></div></div>
  <div class="rotate"><div class="phone"></div><div>Поверни телефон вертикально</div></div>
  <div class="loading" id="loading">Загружаем ферму…</div>
</div>

<script src="lib/phaser.min.js"></script>
<script>
// ===================== Общие настройки =====================
const DPR = Math.min(window.devicePixelRatio || 1, 3);
const GAME_VERSION = 101;   // совпадает с номером в sw.js (farm-vN); видно в окне «Заново»
// Слои земли (трава, дорожки, поля, тени) — глубже любых персонажей и деревьев, даже с отрицательной y
const GROUND = -5000;
// Карта: y от −1000 до 2000. Верх (y < 0) — поле с пшеницей, низ (y > 1000) — пастбище Нанамина
const WORLD = { x: -560, w: 2800, top: -1700, h: 3700 };   // x — левый край (карта расширена влево), w — правый край   // карта расширена вправо (было 1400) и вверх — море над полем
const WW = 2800 + 560;     // полная ширина карты (WORLD.w - WORLD.x)
const OZERO_X = 2000;     // локация «Скалы» (раньше «Озеро»): правая часть фермы между полем и пастбищем, отделена забором
const SAVE_KEY = 'farm-prototype-v1';
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const app = $('app');

const ZONES = {
  ogorod:    { name: 'Огород' },
  kuryatnik: { name: 'Курятник' },
  sad:       { name: 'Сад' },
  pastbishe: { name: 'Пастбище' },
  pole:      { name: 'Поле' },
  skaly:     { name: 'Скалы' },
  more:      { name: 'Море' },
};
const zoneAt = (x, y) => y < -1000 ? 'more' : y < 0 ? 'pole' : y >= 1000 ? 'pastbishe' : x < 700 ? 'ogorod' : x >= OZERO_X ? 'skaly' : (y < 500 ? 'kuryatnik' : 'sad');

const SPEAKERS = {
  grandpa: { name: 'Сверкель', letter: 'С', color: '#5E6675' },
  klara: { name: 'Клара',          letter: 'К', color: '#D99A1E' },
  nanamin: { name: 'Нанамин',      letter: 'Н', color: '#5B7FA6' },
  thorfinn: { name: 'Торфинн',     letter: 'Т', color: '#C9A55A' },
  iro:     { name: 'Дядя Айро',    letter: 'А', color: '#7A8B3A' },
  kale:    { name: 'Кейл',         letter: 'К', color: '#3E8C8C' },
  zmey:    { name: 'Змей',         letter: 'З', color: '#6E4D66' },
  torgel:  { name: 'Торгель',      letter: 'Т', color: '#8A3430' },
  thought: { name: 'Мысли героини', letter: '…', color: '#8FB3C9', thought: true },
  hero:    { name: 'Героиня',      letter: 'Я', color: '#4DA3D9' },
  test:    { name: 'Тест грядки',   letter: '⚙', color: '#8A8A8A' },   // ВРЕМЕННО: меню для теста грядок
};

// Пастбище: загон для коров (сломан в 3 местах), Нанамин рядом, 4 коровы бродят по пастбищу
const PEN = { x: 180, y: 1400, w: 530, h: 350, gateX1: 330, gateX2: 400 };   // загон увеличен
const PEN_SPOTS = [{ x: 180, y: 1500 }, { x: 440, y: 1750 }, { x: 710, y: 1470 }];
const COW_HOMES = [{ x: 1080, y: 1200 }, { x: 930, y: 1720 }, { x: 330, y: 1880 }, { x: 1700, y: 1450 },
                   { x: 2230, y: 1330 }, { x: 420, y: 1230 }, { x: 2150, y: 1800 }, { x: 2600, y: 1650 }];   // пастбище теперь на всю ширину

const BEDS = [{ x: 335, y: 642, len: 230 }, { x: 410, y: 642, len: 230 }, { x: 485, y: 642, len: 230 }, { x: 560, y: 642, len: 230 }];   // центр и длина грядки (len), можно менять; первые 3 — сюжетные (полив)
const QUEST_BEDS = 3;

// Точки, к которым героиня подходит, и дистанция, с которой срабатывает действие
const ANCHORS = {
  grandpa: { x: 312, y: 378, reach: 72, mark: -118 },
  well:    { x: 140, y: 560, reach: 92, mark: -92 },
  zmey:    { x: 228, y: 588, reach: 72, mark: -118 },
  chop:    { x: -395, y: 336, reach: 70, mark: -70 },    // колода для рубки дров у дровника
  barn:    { x: -130, y: 205, reach: 62, mark: -150 },   // ворота амбара (к ним ведёт проход слева, за маленьким домиком)
  torgel:  { x: -290, y: 440, reach: 76, mark: -140 },   // Торгель, сын Кетиля — пока стоит на площадке перед домиком   // Змей — главный помощник на ферме; пока стоит у колодца
  bed0:    { ...BEDS[0], reach: 84, mark: -84 },
  bed1:    { ...BEDS[1], reach: 84, mark: -84 },
  bed2:    { ...BEDS[2], reach: 84, mark: -84 },
  bed3:    { ...BEDS[3], reach: 84, mark: -84 },
  gate:    { x: 700, y: 250, reach: 64, mark: -72 },
  klara:   { x: 940, y: 320, reach: 72, mark: -118 },
  nanamin: { x: 800, y: 1580, reach: 72, mark: -118 },   // справа от загона
  door:    { x: 210, y: 320, reach: 62, mark: -140 },   // дверь дома дедушки (вечером — «Лечь спать»)
  fieldGate: { x: 588, y: -40, reach: 0, mark: -50 },   // проход в поле (только цель для маркера)
  thorfinn: { x: 650, y: -530, reach: 72, mark: -118 }, // пост Торфинна у перекрёстка в поле (сам он двигается)
  iro:     { x: 943, y: 757, reach: 84, mark: -102 },
  kale:    { x: 688, y: -1192, reach: 84, mark: -138 },   // Кейл, капитан корабля — на пляже у пристани   // Дядя Айро, чайный мастер — у пруда в саду
  pen0:    { ...PEN_SPOTS[0], reach: 64, mark: -60 },
  pen1:    { ...PEN_SPOTS[1], reach: 64, mark: -60 },
  pen2:    { ...PEN_SPOTS[2], reach: 64, mark: -60 },
};
// Точка цели: у коров она двигается вместе с ними
function anchorOf(id) {
  if (id && id.startsWith('cow')) { const c = cows[+id.slice(3)]; return { x: c.x, y: c.y, reach: 72, mark: -82 }; }
  if (id && id.startsWith('bed')) {   // у длинной грядки точка — ближайшее к героине место вдоль неё, облачко — над грядкой
    const b = BEDS[+id[3]], top = b.y - b.len / 2, y = Math.max(top, Math.min(b.y + b.len / 2, player ? player.y : b.y));
    return { x: b.x, y, reach: 56, mark: top - y - 10 };
  }
  if (id === 'thorfinn' && thorfinnChar) return { x: thorfinnChar.x, y: thorfinnChar.y, reach: 72, mark: -118 };
  return ANCHORS[id];
}

// ===================== Сохранение =====================
const freshState = () => ({
  step: 0,
  items: { can: false, key: false, eggs: 0 },
  watered: [false, false, false],
  bedCrop: [],   // ВРЕМЕННО для тестов: что выращено на грядке ('morkov' | 'kapusta' | 'tykva' | 'rostki' | 'pustaya')
  open: { ogorod: true, kuryatnik: true, sad: true, pastbishe: true, pole: true, skaly: true, more: true }, // ВРЕМЕННО для тестов: все локации открыты сразу
  pos: { x: 300, y: 430 },
  // квест Нанамина: stage 0 — не знаем о нём, 1 — чиним загон, 2 — собираем коров, 3 — можно поговорить, 4 — готово
  // tools: 0 — ещё не пробовали чинить, 1 — нужны инструменты, 2 — Сверкель попросил наколоть дров, 3 — дрова готовы, 4 — идти в амбар, 5 — ящик у нас
  nanamin: { seen: false, stage: 0, fixed: [false, false, false], cows: COW_HOMES.map(() => 0), visited: false, tools: 0, barn: { round1: false, helped: null } },
  // время суток меняется по сюжету: day → evening (после квеста Нанамина) → сон → morning → day
  time: { day: 1, phase: 'day' },
  // день 2: stage 0 — ещё не начался, 1 — дед попросил помочь в поле, 2 — героиня пришла в поле
  day2: { stage: 0, visitedField: false },
});
function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw), d = freshState();
      const st = { ...d, ...s, items: { ...d.items, ...s.items }, open: { ...d.open, ...s.open }, nanamin: { ...d.nanamin, ...s.nanamin }, time: { ...d.time, ...s.time }, day2: { ...d.day2, ...s.day2 } };
      // старые сохранения: коров было 4, теперь 8 — новые коровы дома, если квест уже пройден
      st.open.kuryatnik = st.open.sad = st.open.skaly = true;   // ВРЕМЕННО для тестов: курятник, сад и скалы открыты
      if (st.step === 4) { st.step = 5; st.items.key = false; }   // калитка уже открыта — шаг «открой калитку» пропускаем
      const nc = st.nanamin.cows;
      while (nc.length < COW_HOMES.length) nc.push(st.nanamin.stage >= 3 ? 2 : 0);
      return st;
    }
  } catch (e) {}
  return freshState();
}
let state = loadState();
function save() {
  try {
    if (player) state.pos = barn.active ? { x: BARN_EXIT.x, y: BARN_EXIT.y } : { x: Math.round(player.x), y: Math.round(player.y) };
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  } catch (e) {}
}

// ===================== Мини-игра «Собери яйца» =====================
function eggGame(onWin) {
  const GOAL = 8, TIME = 20;
  openModal(`<div class="card mg">
    <div class="info">
      <div class="badge">Мини-игра</div>
      <h2>Собери яйца</h2>
      <p>Нажимай на яйца, пока куры их не спрятали. Золотое считается за два.</p>
      <div class="mg-stats"><span>Яйца: <b id="mgCount">0</b> из ${GOAL}</span><span>Время: <b id="mgTime">${TIME}</b> с</span></div>
      <div class="bar"><i id="mgBar"></i></div>
      <div class="row"><button class="btn" id="mgStart" type="button">Начать</button></div>
    </div>
    <div class="nests" id="nests">${Array.from({ length: 9 }, (_, i) => `<button class="nest" type="button" data-i="${i}" aria-label="Гнездо ${i + 1}"><span class="egg"></span></button>`).join('')}</div>
  </div>`);
  const nests = [...document.querySelectorAll('.nest')];
  let count = 0, left = TIME, running = false, tick = null, spawnAcc = 0;
  const life = new Array(9).fill(0);

  const paint = () => {
    $('mgCount').textContent = Math.min(count, GOAL);
    $('mgTime').textContent = Math.ceil(left);
    $('mgBar').style.width = Math.min(100, count / GOAL * 100) + '%';
  };
  nests.forEach((n, i) => n.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!running || !n.classList.contains('has')) return;
    count += n.classList.contains('gold') ? 2 : 1;
    n.classList.remove('has', 'gold'); life[i] = 0;
    paint();
    if (count >= GOAL) finish(true);
  }));

  function start() {
    $('mgStart').closest('.row').hidden = true;
    running = true; count = 0; left = TIME; paint();
    tick = setInterval(() => {
      left -= 0.1;
      const t = 1 - left / TIME;
      // яйца появляются всё чаще и прячутся быстрее
      spawnAcc += 100;
      if (spawnAcc >= 760 - t * 280) {
        spawnAcc = 0;
        const free = nests.map((n, i) => i).filter(i => !nests[i].classList.contains('has'));
        if (free.length) {
          const i = free[Math.floor(Math.random() * free.length)];
          nests[i].classList.add('has');
          if (Math.random() < 0.15) nests[i].classList.add('gold');
          life[i] = 1300 - t * 450;
        }
      }
      nests.forEach((n, i) => {
        if (life[i] > 0) { life[i] -= 100; if (life[i] <= 0) n.classList.remove('has', 'gold'); }
      });
      paint();
      if (left <= 0) finish(false);
    }, 100);
  }
  function finish(win) {
    running = false; clearInterval(tick);
    if (win) {
      openModal(`<div class="card"><div class="badge">Получилось</div><h2>Корзина полна!</h2>
        <p>Восемь яиц собраны. Клара будет довольна.</p>
        <div class="row"><button class="btn" id="mgOk" type="button">Отдать Кларе</button></div></div>`);
      $('mgOk').onclick = () => { closeModal(); onWin(Math.max(count, GOAL)); };
    } else {
      openModal(`<div class="card"><div class="badge">Почти</div><h2>Собрано ${count} из ${GOAL}</h2>
        <p>Куры оказались быстрее. Попробуем ещё раз?</p>
        <div class="row"><button class="btn secondary" id="mgLater" type="button">Позже</button>
        <button class="btn" id="mgAgain" type="button">Ещё раз</button></div></div>`);
      $('mgLater').onclick = () => { closeModal(); toast('Клара подождёт. Подойди к ней, когда будешь готова', 'info'); };
      $('mgAgain').onclick = () => { closeModal(); eggGame(onWin); };
    }
  }
  $('mgStart').onclick = start;
}

// ===================== Сюжет: что происходит при взаимодействии =====================
function interact(id) {
  const s = state;
  if (id === 'grandpa') return askGrandpa();
  if (id === 'klara') return talkKlara();
  if (id === 'nanamin') return talkNanamin();
  if (id === 'iro') return talkIro();
  if (id === 'kale') return talkKale();
  if (id === 'zmey') return talkZmey();
  if (id === 'chop') return startChopping();
  if (id === 'barn') return enterBarn();
  if (id === 'torgel') return talkTorgel();
  if (id === 'door') return goToSleep();
  if (id === 'thorfinn') return showDialog([
    // ЗАГЛУШКА: реплика Торфинна при обычном разговоре — заменим на твою
    ['thorfinn', 'Я Торфинн, слежу за полем. Ходи только по дорожкам — и мы поладим.'],
  ]);
  if (id.startsWith('pen')) return repairPen(+id[3]);
  if (id.startsWith('cow')) return callCow(+id.slice(3));
  if (id === 'well') {
    if (s.step === 1) { s.items.can = true; s.step = 2; splash(140, 545); toast('Получено: лейка'); progress(); scene.wellG && scene.wellG.clear(); }
    else toast(s.items.can ? 'Вода в колодце ледяная и чистая' : 'Это колодец. Рядом висит старая лейка', 'info');
    return;
  }
  if (id.startsWith('bed')) {
    const i = +id[3];
    if (i >= QUEST_BEDS || !s.items.can || s.watered[i]) return testBed(i);   // ВРЕМЕННО: меню теста грядок
    s.watered[i] = true; drawBed(i); splash(BEDS[i].x, BEDS[i].y - 10);
    const n = s.watered.filter(Boolean).length;
    if (n === 3) { s.step = 3; toast('Все грядки политы!'); } else toast(`Полито ${n} из 3`, 'info');
    progress(); return;
  }
  if (id === 'gate') {
    if (s.open.kuryatnik) return;
    if (!s.items.key) { toast('Калитка заперта. Ключ у Сверкеля', 'info'); return; }
    openKuryatnik();
  }
}

function talkGrandpa() {
  const s = state;
  if (s.step === 0) return showDialog([
    ['grandpa', 'Вот и ты! Добро пожаловать на нашу ферму.'],
    ['grandpa', 'Хозяйство совсем заросло, одному мне не справиться.'],
    ['grandpa', 'Начнём с огорода. Возьми лейку у колодца и полей все три грядки.'],
  ], () => { s.step = 1; progress(); });
  if (s.step === 3) return showDialog([
    ['grandpa', 'Ох, какие всходы! Сразу видно, рука лёгкая.'],
    ['grandpa', 'Держи ключ от калитки. За ней курятник, там живёт Клара.'],
    ['grandpa', 'Она давно ждёт помощи. Сходи познакомься.'],
  ], () => { if (s.open.kuryatnik) { s.step = 5; progress(); return; } s.items.key = true; s.step = 4; toast('Получено: ключ от калитки'); progress(); });
  if (s.step === 7) return showDialog([
    ['grandpa', 'Свежие яйца! Испеку пирог на всю округу.'],
    ['grandpa', 'А за курятником старый сад. Его хозяин давно не показывался…'],
    ['grandpa', 'Но это уже совсем другая история.'],
  ], () => { s.step = 8; s.items.eggs = 0; progress(); showFinal(); });
  const idle = {
    1: 'Лейка висит у колодца, слева от грядок.',
    2: 'Полей все три грядки, они совсем пересохли.',
    4: 'Калитка справа, в конце дорожки.',
    5: 'Клара только с виду строгая, не бойся.',
    6: 'Клара просила помочь с яйцами? Она без этого не отпустит.',
    8: 'Пирог уже в печи!',
  }[s.step] || 'Как дела? Ферма тебе ещё не надоела?';
  showDialog([['grandpa', idle]]);
}

// Если героиня уже видела грустного Нанамина, у дедушки можно спросить о нём
function askGrandpa() {
  const nm = state.nanamin;
  if (nm.stage === 1 && (nm.tools === 1 || nm.tools === 3)) return toolsTalk();
  if (nm.stage === 1 && (nm.tools === 2 || nm.tools === 4) && ![0, 3, 7].includes(state.step)) return toolsTalk();
  if (state.nanamin.seen && state.nanamin.stage === 0) {
    return showChoice('grandpa', 'Что-то хотела спросить?', [
      ['Как дела на ферме?', talkGrandpa],
      ['Кто этот грустный человек у загона?', askAboutNanamin],
    ]);
  }
  talkGrandpa();
}
// Инструменты для загона: Сверкель даст ящик, но сперва — дрова (реплики — черновик, можно поправить)
function toolsTalk() {

// Вечер = тёплый закат (умножение) + полупрозрачная сине-сиреневая дымка сумерек поверх
const TINTS = {
  evening: { color: 0xE58C58, alpha: 0.62, haze: 0x3E4C92, hazeAlpha: 0.2 },   // тёплый закат + немного синевы
  morning: { color: 0xF6C7B4, alpha: 0.3 },

let timeTint = null, timeHaze = null, windowGlow = null, fireflies = [];
function buildTimeLayer() {
  timeTint = scene.add.rectangle(WORLD.x, WORLD.top, WW, WORLD.h, 0xffffff).setOrigin(0, 0).setDepth(5800).setAlpha(0);
  timeTint.setBlendMode(Phaser.BlendModes.MULTIPLY);

    ctx.fillStyle = grd; ctx.fillRect(0, 0, 32, 32); t.refresh();

}
function applyTime(instant) {
  const ph = state.time.phase, t = TINTS[ph];
  if (t) timeTint.setFillStyle(t.color);
  const to = (obj, alpha, dur) => {
    scene.tweens.killTweensOf(obj);
    if (instant) obj.setAlpha(alpha); else scene.tweens.add({ targets: obj, alpha, duration: dur, ease: 'Sine.easeInOut' });
  };
  to(timeTint, t ? t.alpha : 0, ph === 'day' ? 6000 : 4000);
  if (t && t.haze) timeHaze.setFillStyle(t.haze);
  to(timeHaze, t && t.haze ? t.hazeAlpha : 0, 4000);
  to(windowGlow, ph === 'evening' ? 1 : 0, 3000);
  if (ph === 'evening') spawnFireflies(); else clearFireflies();
}
// Светлячки: мерцают и медленно летают над травой
// Появляются плавно, маленькими группками по 4–6 штук, одна группа за другой
function spawnFireflies() {
  if (fireflies.length) return;
  const rnd = mulberry32(99);
  // карта делится на участки (5 по ширине, по одному ряду на ~285 точек высоты), в каждом — своя группка
  const COLS = Math.round(WW / 280), ROWS = Math.round(WORLD.h / 285), cw = WW / COLS, ch = WORLD.h / ROWS;
  const cells = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) cells.push([c, r]);
  for (let i = cells.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [cells[i], cells[j]] = [cells[j], cells[i]]; }
  for (let g = 0; g < cells.length; g++) {
    const [c, r] = cells[g];
    const gx = WORLD.x + (c + 0.15 + rnd() * 0.7) * cw, gy = WORLD.top + (r + 0.15 + rnd() * 0.7) * ch;
    const groupDelay = 1000 + g * 330 + rnd() * 300;        // группы зажигаются по очереди, в случайном порядке
    const n = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      const f = scene.add.image(gx + (rnd() - 0.5) * 140, gy + (rnd() - 0.5) * 100, 'firefly')
        .setDepth(5900).setBlendMode(Phaser.BlendModes.ADD).setScale(0.28 + rnd() * 0.22).setAlpha(0);
      fireflies.push(f);
      const drift = () => {
        if (!f.active) return;
        scene.tweens.add({ targets: f, x: f.x + (Math.random() - 0.5) * 100, y: f.y + (Math.random() - 0.5) * 70,
          duration: 2800 + Math.random() * 3200, ease: 'Sine.easeInOut', onComplete: drift });
      };
      drift();
      // плавно загорается, потом мягко мерцает
      scene.tweens.add({
        targets: f, alpha: 0.75, duration: 1800, delay: groupDelay + i * 220, ease: 'Sine.easeInOut',
        onComplete: () => {
          if (!f.active) return;
          scene.tweens.add({ targets: f, alpha: { from: 0.75, to: 0.2 }, duration: 900 + Math.random() * 900,
            yoyo: true, repeat: -1, hold: 300 + Math.random() * 700, repeatDelay: Math.random() * 1200, ease: 'Sine.easeInOut' });
        },
      });
    }
  }
}
function clearFireflies() {
  fireflies.forEach(f => { scene.tweens.killTweensOf(f); f.destroy(); });
  fireflies = [];
}

}

}
zone.addEventListener('pointerdown', e => {

    const hit = hitTest(cam.worldView.x + px / z, cam.worldView.y + py / z);

});

// клавиатура на компьютере: стрелки/WASD — ходьба, пробел/E/Enter — действие
const KEYMAP = { ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0], ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1] };
window.addEventListener('keydown', e => {
  if (KEYMAP[e.code]) { keys.add(e.code); e.preventDefault(); return; }
  if (e.code === 'Space' || e.code === 'KeyE' || e.code === 'Enter') {
    if (e.repeat) return;
    if (dlg.lines) { e.preventDefault(); advanceDialog(); }
    else if (!ui.open) { e.preventDefault(); doAction(); }
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());
function inputVector() {
  if (keys.size) {
    let kx = 0, ky = 0;
    keys.forEach(k => { kx += KEYMAP[k][0]; ky += KEYMAP[k][1]; });
    const d = Math.hypot(kx, ky);
    if (d) return { x: kx / d, y: ky / d };
  }
  return { x: move.x, y: move.y };
}

// облачко действия: появляется над ближайшим персонажем или предметом
function nearest() {
  let best = null, bd = Infinity;
  const nm = state.nanamin;
  const ids = Object.keys(ANCHORS).concat(cows.filter(c => !c.following && nm.cows[c.idx] !== 2).map(c => 'cow' + c.idx));
  for (const id of ids) {
    if (id === 'klara' && !state.open.kuryatnik) continue;
    if (id === 'gate' && state.open.kuryatnik) continue;
    if (id.startsWith('pen') && (nm.stage !== 1 || nm.fixed[+id[3]])) continue;
    if (id === 'door' && state.time.phase !== 'evening') continue;
    if (id === 'fieldGate') continue;
    if (id === 'thorfinn' && thor.mode !== 'idle') continue;
    if (id === 'iro' && !state.open.sad) continue;
    if (id === 'chop' && !(state.nanamin.stage === 1 && state.nanamin.tools === 2)) continue;
    if (id === 'barn' && !(state.nanamin.stage === 1 && state.nanamin.tools === 4)) continue;
    const a = anchorOf(id), d = Math.hypot(player.x - a.x, player.y - a.y);
    if (d <= a.reach && d < bd) { bd = d; best = id; }
  }
  return best;
}
function actionLabel(id) {
  if (!id) return 'Действие';
  if (id.startsWith('pen')) return 'Починить';
  if (id === 'door') return 'Лечь спать';
  if (id === 'chop') return 'Колоть дрова';
  if (id === 'barn') return 'Войти в амбар';
  if (id.startsWith('cow')) return state.nanamin.stage === 2 ? 'Позвать' : 'Осмотреть';
  if (id === 'well') return state.step === 1 ? 'Взять лейку' : 'Осмотреть';
  if (id.startsWith('bed')) return +id[3] < QUEST_BEDS && state.items.can && !state.watered[+id[3]] ? 'Полить' : 'Грядка (тест)';
  if (id === 'gate') return 'Открыть';
  return 'Поговорить';
}

  nearId = ui.open ? null : nearest();

  const label = actionLabel(nearId);
  if (bubble.textContent !== label) bubble.textContent = label;
  const a = anchorOf(nearId), cam = scene.cameras.main, z = cam.zoom / DPR, wv = cam.worldView;
  const sx = (a.x - wv.x) * z, sy = (a.y + a.mark - 6 - wv.y) * z;

}

  if (ui.open || !nearId) return;

}

// --- Отрисовка окружения ---
// Мягкие пятна поверх травы: разбивают повтор плитки
function breakRepetition() {
  const rnd = mulberry32(21);
  if (!scene.textures.exists('blob')) {
    const t = scene.textures.createCanvas('blob', 256, 256);
    const ctx = t.getContext();
    const grd = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.55, 'rgba(255,255,255,0.55)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, 256, 256); t.refresh();
  }
  // тёмные, золотистые и светлые пятна разного размера
  const tints = [[0x2F5A22, 0.22], [0x2F5A22, 0.16], [0xD9B45A, 0.16], [0xC8DC7A, 0.14]];
  for (let i = 0; i < Math.round(26 * WORLD.h / 1000 * WW / 1400); i++) {
    const [tint, a] = tints[i % tints.length];
    scene.add.image(WORLD.x + rnd() * WW, WORLD.top + rnd() * WORLD.h, 'blob').setTint(tint).setAlpha(a)
      .setScale(1.2 + rnd() * 2.2, 0.8 + rnd() * 1.4).setRotation(rnd() * Math.PI).setDepth(GROUND - 11);
  }
  // Плоские листья-овалы убраны: они были в другом стиле, чем рисованная земля.
  // Опавшие листья добавим позже отдельными рисованными картинками.
}

// ===================== Дорожки из кусочков =====================
// Карта поделена на клетки CELL×CELL. В PATHS перечислены отрезки дорожек
// [колонка1, ряд1, колонка2, ряд2] — горизонтальные или вертикальные.
// Кусочки (углы, края, развилки) игра подбирает сама: у каждого кусочка 4 угла,
// каждый угол — клетка «дорожка» или «трава» (16 вариантов в atlas'е path-mask.png).
const CELL = 56;
const PATHS = [
  [3, 4, 3, 7],     // от дома дедушки вниз
  [3, 7, 10, 7],    // вдоль огорода
  [-11, 4, 5, 8],    // общая площадка под домами деревни и вокруг них (из той же дорожки)
  [10, 4, 10, 7],   // вверх к калитке
  [10, 4, 18, 4],   // через калитку к курятнику
  [18, 4, 40, 4],   // от курятника на восток, через проход в заборе — к поляне среди скал
  [18, 4, 19, 4],   // поворот к калитке сада
  [19, 4, 19, 9],   // вниз через калитку сада (калитка 1030–1130: открытая створка слева, проход — ровно по дорожке)
  [18, 10, 20, 10], // дальше дорожка расширяется к пруду
  [17, 11, 21, 11],
  [10, 7, 11, 7],   // от поворота у огорода — на клетку вправо
  [11, 7, 11, 22],  // вниз, через проход в заборе — на пастбище
  [11, 22, 21, 22], // по пастбищу на восток, к полям
  [6, 22, 11, 22],  // на запад, к загону
  [6, 22, 6, 24],   // ко входу в загон
  [10, -15, 10, 3], // от калитки курятника вверх, через проход в заборе — в поле
  [10, -19, 10, -15], // дальше вверх через поле — к пляжу и пристани
  [2, -9, 47, -9],  // по полю поперёк, между участками пшеницы
];
const PATH_TILE = 160;          // размер кусочка в атласе, px
const DIRT_WORLD = 196;         // одна плитка земли = 196 точек карты
const PATH_RES = 2;             // во сколько раз чётче точек карты рисуем дорожку

function pathCells() {
  const set = new Set();
  for (const [c1, r1, c2, r2] of PATHS) {
    for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++)
      for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) set.add(c + ',' + r);
  }
  return set;
}

function drawPaths() {
  const cells = pathCells();
  if (!cells.size) return;
  const list = [...cells].map(k => k.split(',').map(Number));
  const c0 = Math.min(...list.map(p => p[0])), c1 = Math.max(...list.map(p => p[0]));
  const r0 = Math.min(...list.map(p => p[1])), r1 = Math.max(...list.map(p => p[1]));
  // область, которую занимают кусочки (они сдвинуты на полклетки)
  const X0 = (c0 - 0.5) * CELL, Y0 = (r0 - 0.5) * CELL;
  const W = (c1 - c0 + 2) * CELL, H = (r1 - r0 + 2) * CELL;
  const has = (c, r) => cells.has(c + ',' + r) ? 1 : 0;
  const maskImg = scene.textures.get('pathMask').getSourceImage();
  const rimImg = scene.textures.get('pathRim').getSourceImage();
  const dirtImg = scene.textures.get('dirt').getSourceImage();

  // все кусочки дорожек: [x в атласе, y в атласе, x на карте, y на карте]
  const tiles = [];
  for (let j = r0; j <= r1 + 1; j++) {
    for (let i = c0; i <= c1 + 1; i++) {
      const idx = has(i - 1, j - 1) | has(i, j - 1) << 1 | has(i - 1, j) << 2 | has(i, j) << 3;
      if (!idx) continue;
      tiles.push([(idx % 4) * PATH_TILE, Math.floor(idx / 4) * PATH_TILE, (i - 0.5) * CELL, (j - 0.5) * CELL]);
    }
  }
  // старые слои дорожек (при «Начать заново»)
  scene.textures.getTextureKeys().filter(k => k.startsWith('pathLayer')).forEach(k => scene.textures.remove(k));

  // Рисуем дорожки кусками не больше ~1800 px: телефоны не умеют картинки больше 4096 px
  const CHUNK = 16 * CELL, tileSize = CELL * PATH_RES, step = DIRT_WORLD * PATH_RES;
  let n = 0;
  for (let cy = Y0; cy < Y0 + H; cy += CHUNK) {
    for (let cx = X0; cx < X0 + W; cx += CHUNK) {
      const ww = Math.min(CHUNK, X0 + W - cx), hh = Math.min(CHUNK, Y0 + H - cy);
      const mine = tiles.filter(([, , tx, ty]) => tx < cx + ww && tx + CELL > cx && ty < cy + hh && ty + CELL > cy);
      if (!mine.length) continue;
      const cw = Math.round(ww * PATH_RES), ch = Math.round(hh * PATH_RES);
      // 1) маска: где земля
      const mask = document.createElement('canvas'); mask.width = cw; mask.height = ch;
      const m = mask.getContext('2d');
      for (const [sx, sy, tx, ty] of mine) m.drawImage(maskImg, sx, sy, PATH_TILE, PATH_TILE, (tx - cx) * PATH_RES, (ty - cy) * PATH_RES, tileSize, tileSize);
      // 2) земля, привязанная к координатам карты, обрезанная по маске
      const key = 'pathLayer' + (n++);
      const tex = scene.textures.createCanvas(key, cw, ch);
      const ctx = tex.getContext();
      const startX = -((cx % DIRT_WORLD) + DIRT_WORLD) % DIRT_WORLD * PATH_RES;
      const startY = -((cy % DIRT_WORLD) + DIRT_WORLD) % DIRT_WORLD * PATH_RES;
      for (let y = startY; y < ch; y += step)
        for (let x = startX; x < cw; x += step) ctx.drawImage(dirtImg, x, y, step, step);
      ctx.globalCompositeOperation = 'destination-in';
      ctx.drawImage(mask, 0, 0);
      // 3) тонкая тёмная кромка по краю
      ctx.globalCompositeOperation = 'source-over';
      for (const [sx, sy, tx, ty] of mine) ctx.drawImage(rimImg, sx, sy, PATH_TILE, PATH_TILE, (tx - cx) * PATH_RES, (ty - cy) * PATH_RES, tileSize, tileSize);
      tex.refresh();
      scene.add.image(cx, cy, key).setOrigin(0, 0).setScale(1 / PATH_RES).setDepth(GROUND - 9);
    }
  }
}

function drawGround() {
  // трава: бесшовная плитка 1024 px, одна плитка ≈ 360 точек карты
  const GRASS_SCALE = 0.35;
  scene.add.tileSprite(WORLD.x, WORLD.top, WW, WORLD.h, 'grass').setOrigin(0, 0).setTileScale(GRASS_SCALE, GRASS_SCALE).setDepth(GROUND - 12);
  breakRepetition();
  const g = scene.add.graphics().setDepth(GROUND - 10);
  drawPaths();
}

function startChopping() {

    <div class="chop-bar"><div class="zone" id="chopZone"></div><div class="mark" id="chopMark"></div></div>
    <div class="chop-msg" id="chopMsg">&nbsp;</div>
    <div class="row"><button class="btn" id="chopBtn" type="button">Рубить!</button></div></div>`);
  const g = { i: 0, hits: 0, stuck: false, busy: false, misses: 0, streak: 0, wood: 0, pos: 0, dir: 1, zc: 0.5, zw: 0.24, last: performance.now(), raf: 0 };
  const log = $('chopLog'), btn = $('chopBtn'), msg = t => { $('chopMsg').textContent = t; };
  const setLog = () => {
    const knot = CHOP_LOGS[g.i];
    g.hits = knot ? 2 : 1;

    $('chopN').textContent = `Чурбак ${g.i + 1} из ${CHOP_LOGS.length}` + (knot ? ' · сучковатый' : '');
  };
  const tick = now => {
    const dt = Math.min(50, now - g.last) / 1000; g.last = now;
    if (!g.stuck && !g.busy) {

      msg(g.streak >= 3 && g.streak % 3 === 0 ? 'Сверкель издалека: «Вот это рука!»' : ['Хрясь!', 'Ровно пополам!', 'Готово!', 'Есть!'][g.i % 4]);

        g.i++; g.busy = false;
        if (g.i >= CHOP_LOGS.length) { cancelAnimationFrame(g.raf); closeModal(); return afterChopping(g.misses); }
        setLog(); msg(' ');
      }, 750);
    } else {
      g.misses++; g.streak = 0; g.stuck = true;
      log.classList.remove('stuck'); void log.offsetWidth; log.classList.add('stuck');
      btn.textContent = 'Вытащить топор'; msg('Топор застрял! Вытащи его и попробуй снова');
    }

  $('chopCard').addEventListener('pointerdown', e => { e.preventDefault(); act(); });
  btn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
  setLog(); g.raf = requestAnimationFrame(tick); btn.focus();
}

// ===================== Коровы: рисованные, из 9 деталей (перекладная анимация) =====================
// Атлас assets/cows/cow-white.png (детали в 0.5 от исходника). Для каждой детали:
// [x, y, w, h в атласе, точка поворота внутри детали (x, y), та же точка в координатах коровки (0,0 — земля под туловищем)]
const COW_PARTS = {"leg-back-far":[78,132,43,64,21.0,12.0,-44.0,-64.0],"leg-back-near":[0,132,40,76,20.5,13.0,-82.0,-63.0],"leg-front-far":[42,132,34,68,21.5,11.0,69.0,-66.0],"leg-front-near":[457,0,42,82,22.0,12.0,35.0,-68.0],"ear":[123,132,51,38,45.0,20.5,60.0,-168.0],"head":[347,0,108,101,21.0,70.5,60.0,-138.0],"tail":[204,0,54,109,48.0,4.5,-91.5,-165.0],"body":[0,0,202,130,104.5,80.0,0.0,-99.0],"neck":[260,0,85,104,15.0,25.0,27.5,-154.0]};
const COW_BODY_PIVOT = [-60, -60];   // туловище наклоняется вокруг задних бёдер
const COW_SCALE = 0.3;               // коровка на поле ≈ 86×63
const COW_LAYERS = ['tail', 'leg-back-far', 'leg-front-far', 'leg-back-near', 'leg-front-near', 'body', 'neck', 'head'];   // снизу вверх; ушко — внутри головы
const cowPiv = k => [COW_PARTS[k][6], COW_PARTS[k][7]];
// Расцветки: у всех одна раскладка деталей (COW_PARTS), разные только картинки. Коровка i берёт расцветку COW_SKINS[i % длина]
const COW_SKINS = ['cowWhite', 'cowPyatna', 'cowBrown', 'cowRyzhaya', 'cowShokolad', 'cowSeraya'];   // белая, пятнистая, коричневая, рыжая, шоколадная, серая (перекрашены вручную)
function registerCowFrames() {
  for (const key of COW_SKINS) {
    const t = scene.textures.get(key);
    for (const [k, f] of Object.entries(COW_PARTS)) if (!t.has(k)) t.add(k, 0, f[0], f[1], f[2], f[3]);
  }
}
function makeCow(i) {
  const home = COW_HOMES[i];
  const c = scene.add.container(home.x, home.y);
  const shadow = scene.add.ellipse(0, -2, 300 * COW_SCALE, 52 * COW_SCALE, 0x1d2a12, 0.22);
  const rig = scene.add.container(0, 0).setScale(COW_SCALE);
  const parts = {};
  const skin = COW_SKINS[i % COW_SKINS.length];
  const img = k => { const f = COW_PARTS[k]; return scene.add.image(0, 0, skin, k).setOrigin(f[4] / f[2], f[5] / f[3]); };
  for (const k of COW_LAYERS) {
    if (k === 'head') {
      const head = scene.add.container(0, 0), h = img('head'), ear = img('ear');
      const e = cowPiv('ear'), hp = cowPiv('head');
      ear.setPosition(e[0] - hp[0], e[1] - hp[1]);
      head.add([h, ear]); parts.head = head; parts.ear = ear; rig.add(head);
    } else { parts[k] = img(k); rig.add(parts[k]); }
  }
  c.add([shadow, rig]);
  Object.assign(c, { rig, parts, idx: i, home, following: false, face: 1, moving: false, walkT: 0, act: null });
  setCowFace(c, Math.random() < 0.5 ? -1 : 1);
  poseCow(c, {});
  return c;
}
function setCowFace(c, face) { c.face = face; c.rig.scaleX = COW_SCALE * face; }

// Позы — углы в градусах (плюс — против часовой, как в превью в Figma), сдвиги — в пикселях атласа
const cowEase = x => 0.5 - 0.5 * Math.cos(Math.PI * Math.max(0, Math.min(1, x)));
const TAU = Math.PI * 2;
function cowWalkPose(t) {
  const s = Math.sin(TAU * t / 0.7);
  return { 'leg-front-near': 16 * s, 'leg-back-far': 16 * s, 'leg-front-far': -16 * s, 'leg-back-near': -16 * s,
           body: -1.5 * Math.abs(s), head: 3 * Math.sin(TAU * t / 0.35), tail: -8 * s };
}
const COW_ACTS = {   // что коровка делает, когда стоит; weight — как часто
  stand: { weight: 3, dur: () => 2.5 + Math.random() * 2.5, pose: t => ({ head: 2 * Math.sin(TAU * t / 1.6), tail: -10 * Math.sin(TAU * t / 0.8) }) },
  ears: { weight: 1.3, dur: () => 1.4, pose: t => {
    let e = 0;
    for (const s of [0.15, 0.75]) if (t >= s && t < s + 0.36) e = 22 * Math.sin(Math.PI * (t - s) / 0.18) * (1 - (t - s) / 0.36);
    return { ear: e, head: t > 0.1 && t < 1.2 ? 2.5 * Math.sin(TAU * t / 0.5) : 0, tail: -8 * Math.sin(TAU * t / 0.8) };
  } },
  graze: { weight: 3, dur: () => 3 + Math.random() * 4, pose: (t, d) => {
    const k = t < 0.7 ? cowEase(t / 0.7) : cowEase((d - t) / 0.7);
    const chew = t >= 0.7 && t < d - 0.7 ? 2.5 * Math.sin(TAU * t / 0.35) : 0;
    return { tilt: -7 * k, neck: -16 * k, head: -10 * k + chew, headDx: 7 * k, headDy: 1 * k, tail: -6 * Math.sin(TAU * t / 1.0), ear: 6 * Math.sin(TAU * t / 0.9) * k };
  } },
  up: { weight: 1.2, dur: () => 2.2, pose: (t, d) => {
    const k = t < 0.6 ? cowEase(t / 0.6) : cowEase((d - t) / 0.6);
    const sniff = t >= 0.6 && t < d - 0.6 ? 1.8 * Math.sin(TAU * t / 0.25) : 0;
    return { tilt: 2 * k, neck: 5 * k, head: 6 * k + sniff, ear: -8 * k, tail: -6 * Math.sin(TAU * t / 1.0) };
  } },
};
function pickCowAct(prev) {
  const names = Object.keys(COW_ACTS).filter(n => n === 'stand' || n !== prev);   // одно и то же (кроме «стоит») два раза подряд не делаем
  let r = Math.random() * names.reduce((s, n) => s + COW_ACTS[n].weight, 0);
  for (const n of names) if ((r -= COW_ACTS[n].weight) <= 0) return n;
  return 'stand';
}
function cowRot(p, c, deg) {
  const a = -deg * Math.PI / 180, x = p[0] - c[0], y = p[1] - c[1];
  return [c[0] + x * Math.cos(a) - y * Math.sin(a), c[1] + x * Math.sin(a) + y * Math.cos(a)];
}
// Раскладывает детали по позе: туловище → шея → голова → ушко; передние ножки подгибаются, копыта на земле
function poseCow(c, P) {
  const tilt = P.tilt || 0, by = P.body || 0, pp = c.parts;
  const T = p => { const q = cowRot(p, COW_BODY_PIVOT, tilt); return [q[0], q[1] + by]; };
  const put = (o, p, deg) => { o.setPosition(p[0], p[1]); o.rotation = -deg * Math.PI / 180; };
  put(pp.tail, T(cowPiv('tail')), tilt + (P.tail || 0));
  for (const k of ['leg-back-far', 'leg-front-far', 'leg-back-near', 'leg-front-near']) {
    const hip = T(cowPiv(k));
    put(pp[k], hip, P[k] || 0);
    pp[k].scaleY = k.startsWith('leg-front') ? Math.min(1, Math.max(0.6, hip[1] / cowPiv(k)[1])) : 1;
  }
  put(pp.body, T(cowPiv('body')), tilt);
  const na = P.neck || 0, ex = [P.headDx || 0, P.headDy || 0], NP = cowPiv('neck'), np = T(NP);
  put(pp.neck, [np[0] + ex[0] * 0.5, np[1] + ex[1] * 0.5], tilt + na);
  const hp = T(cowRot(cowPiv('head'), NP, na));
  put(pp.head, [hp[0] + ex[0], hp[1] + ex[1]], tilt + na + (P.head || 0));
  pp.ear.rotation = -(P.ear || 0) * Math.PI / 180;
}
// Каждый кадр: идущая коровка шагает, стоящая — сама выбирает, что делать
function animateCows(dt) {
  const s = Math.min(dt, 50) / 1000, view = scene.cameras.main.worldView;
  for (const c of cows) {
    let P;
    if (c.moving) { c.walkT += s; P = cowWalkPose(c.walkT); }
    else {
      c.walkT = 0;
      if (!c.act || c.act.t >= c.act.d) { const n = pickCowAct(c.act && c.act.name); c.act = { name: n, t: 0, d: COW_ACTS[n].dur() }; }
      c.act.t += s;
      P = COW_ACTS[c.act.name].pose(c.act.t, c.act.d);
    }
    if (REDUCED) P = {};
    // за кадром не пересчитываем — экономим телефон
    if (c.x < view.x - 120 || c.x > view.right + 120 || c.y < view.y - 40 || c.y > view.bottom + 160) continue;
    poseCow(c, P);
  }
}
function cowWander(c) {
  const penned = state.nanamin.cows[c.idx] === 2;
  const nx = penned ? PEN.x + 60 + Math.random() * (PEN.w - 120) : c.home.x + (Math.random() - 0.5) * 220;

// Каждый кадр: коровы идут за героиней, мысли у загона и у Нанамина
function updatePasture(dt) {
  const nm = state.nanamin;
  let lead = player;
  for (const c of [...followers]) {
    const dx = lead.x - c.x, dy = lead.y - c.y, d = Math.hypot(dx, dy);
    c.moving = d > 62;
    if (c.moving) {
      const sp = Math.min(d - 62, 210 * Math.min(dt, 50) / 1000);
      c.x += dx / d * sp; c.y += dy / d * sp;
      if (Math.abs(dx) > 2) setCowFace(c, dx < 0 ? -1 : 1);
    }
    if (c.x > PEN.x + 20 && c.x < PEN.x + PEN.w - 20 && c.y > PEN.y + 30 && c.y < PEN.y + PEN.h - 10) { cowPenned(c); continue; }
    lead = c;
  }
  animateCows(dt);
  cows.forEach(c => c.setDepth(c.y));
  if (ui.open || barn.active) return;   // в амбаре (он нарисован за картой) пастбищные события не срабатывают

}

const OVERVIEW = /[?&]overview/.test(location.search);
function fitCamera() {
  const cam = scene.cameras.main;
  const W = app.clientWidth, H = app.clientHeight;
  cam.setSize(Math.round(W * DPR), Math.round(H * DPR));
  if (OVERVIEW) { cam.setZoom(DPR * Math.min(W / WW, H / WORLD.h)); cam.centerOn(WORLD.x + WW / 2, WORLD.top + WORLD.h / 2); return; }
  if (barn.active) { cam.setZoom(DPR * Math.min(1.15, W / (BW + 40))); return; }   // в амбаре: по ширине — весь амбар, по высоте камера едет за героиней
  // на вертикальном телефоне чуть отдаляем камеру, чтобы по бокам было видно больше фермы
  const base = Math.min(W, H) < 500 ? (H > W ? 0.9 : 1) : 1.15;
  const cover = Math.max(W / WW, H / WORLD.h);
  cam.setZoom(DPR * Math.max(base, cover));
}
function resizeGame() {
  if (stick.id === null) idleStick();
  if (!game) return;
  const W = app.clientWidth, H = app.clientHeight;
  game.scale.resize(Math.round(W * DPR), Math.round(H * DPR));
  game.scale.setZoom(1 / DPR);
  if (scene && scene.cameras && scene.cameras.main) fitCamera();
}

// --- Подсказка-стрелка к цели задания за краем экрана ---
function updateGuide() {
  const el = $('guide');
  const id = questTarget();
  if (!id || ui.open) { el.hidden = true; return; }
  const a = ANCHORS[id], cam = scene.cameras.main, z = cam.zoom / DPR, wv = cam.worldView;
  const sx = (a.x - wv.x) * z, sy = (a.y - 40 - wv.y) * z;
  // стрелка нужна, только если цель за краем экрана; держим её ниже карточки задания
  const W = app.clientWidth, H = app.clientHeight, m = 34, top = 140;
  if (sx > m && sx < W - m && sy > m && sy < H - m) { el.hidden = true; return; }
  const cx = W / 2, cy = H / 2, dx = sx - cx, dy = sy - cy;
  const kx = dx ? ((dx > 0 ? W - m : m) - cx) / dx : Infinity;
  const ky = dy ? ((dy > 0 ? H - m : top) - cy) / dy : Infinity;
  const k = Math.min(kx, ky);
  el.style.transform = `translate(${cx + dx * k}px, ${cy + dy * k}px)`;
  el.firstElementChild.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
  el.hidden = false;
}

class FarmScene extends Phaser.Scene {
  constructor() { super('farm'); }
  preload() {
    this.load.image('grass', 'assets/ground/grass.jpg');
    this.load.image('cowWhite', 'assets/cows/cow-white.png');
    this.load.image('cowPyatna', 'assets/cows/cow-pyatna.png');
    this.load.image('cowBrown', 'assets/cows/cow-brown.png');
    this.load.image('cowRyzhaya', 'assets/cows/cow-ryzhaya.png');
    this.load.image('cowShokolad', 'assets/cows/cow-shokolad.png');
    this.load.image('cowSeraya', 'assets/cows/cow-seraya.png');
    this.load.image('fence', 'assets/fence/fence.png');
    for (const k of new Set([...GARDEN.map(g => g[0]).filter(k => k.startsWith('g-')), 'g-pond', 'g-iro'])) this.load.image(k, 'assets/garden/' + k.slice(2) + '.webp');
    this.load.image('kale', 'assets/chars/kale.png');
    for (const k of new Set(BUILDINGS.map(b => b[0]))) this.load.image('h-' + k, 'assets/houses/' + k + '.webp');
    this.load.image('wheatPlot', 'assets/fields/wheat-plot.webp');
    this.load.image('prop-well', 'assets/props/well.webp');
    this.load.image('prop-chop', 'assets/props/chop-block.webp');
    this.load.image('beds', 'assets/fields/beds.webp');
    this.load.image('dirt', 'assets/paths/dirt.jpg');
    this.load.image('pathMask', 'assets/paths/path-mask.png');
    this.load.image('pathRim', 'assets/paths/path-rim.png');
    TREE_FILES.forEach(([k, f]) => this.load.image(k, 'assets/trees/' + f));
  }
  create() {
    scene = this;
    // после «Заново» и пропуска квеста сцена создаётся заново — комнату амбара тоже нужно нарисовать заново
    Object.assign(barn, { active: false, built: false, carry: false, grid: null, path: null }); document.body.classList.remove('in-barn');
    lockLayers = {}; bedG = []; chickens.length = 0; nearId = null;

    drawGround();
    drawFences();
    drawHouse();
    drawWell();
    drawCoop();
    registerBedFrames();
    for (let i = 0; i < BEDS.length; i++) drawBed(i);
    PLANTS.forEach(([key, x, y, s]) => plant(key, x, y, s));
    drawGarden();
    drawChopBlock();

    for (let i = 0; i < 5; i++) { const ch = makeChicken(800 + i * 110, 300 + (i % 2) * 120); chickens.push(ch); wander(ch); }

    // Сверкель (дед, отец Кетиля): лысый с пятнышками, седые пряди до плеч, седая бородка и усы, тяжёлые веки,
    // серо-синяя рубаха на круглом животе, полотенце на шее, руки за спиной
    const grandpa = makeChar({ skin: 0xE6B38C, dress: 0x667083, belly: true, belt: 0x2E2A28, buckle: 0x55504A, legs: 0x4E5560, scarf: 0xBDB8A2,
      hair: 'bald', hairColor: 0xC4C0B6, goatee: true, heavyLids: true, handsBehind: true, noBlush: true, calm: true });
    grandpa.setPosition(312, 378).setDepth(378);
    nameLabel('Сверкель', 312, 300);

    klara = makeChar({ skin: 0xE8B48F, dress: 0x5E9E57, apron: 0xF7E3B5, hair: 'scarf', hairColor: 0xF2C94C });
    klara.setPosition(940, 320).setDepth(320).setVisible(state.open.kuryatnik);
    klara.bodyG.scaleX = -1;
    klaraLabel = nameLabel('Клара', 940, 242).setVisible(state.open.kuryatnik);
    // Змей: тёмные волнистые волосы, щетина, туника сливового цвета, серые штаны, высокие сапоги, меч на поясе
    const zmey = makeChar({ skin: 0xD9A57A, dress: 0x6E4D66, tunic: true, belt: 0x232020, buckle: 0xBFC3C6, legs: 0x9DA2A6, boots: 0x4F4A33,
      hair: 'wavy', hairColor: 0x2B1E1A, stubble: true, brows: true, smirk: true, noBlush: true, sword: true });
    zmey.setPosition(228, 588).setDepth(588);
    zmey.bodyG.scaleX = -1;   // смотрит на колодец
    nameLabel('Змей', 228, 510);
    // Торгель: сын Кетиля, крупнее остальных; светлые волосы зачёсаны назад, борода, шрам, тёмно-красная туника с горчичной отделкой, прямой меч
    const torgel = makeChar({ skin: 0xD6A078, dress: 0x7E2F2B, tunic: true, trim: 0xC9A040, belt: 0x4A3020, buckle: 0xBFC3C6, legs: 0xD9CDB2, boots: 0x7A5A3A,
      hair: 'swept', hairColor: 0xE8D27E, jawBeard: true, scar: true, stern: true, noBlush: true, longsword: true, scale: 1.18 });
    torgel.setPosition(-290, 440).setDepth(440);
    nameLabel('Торгель', -290, 346);
    this.npcs = [grandpa, klara, zmey, torgel];
    nanaminChar = null;
    buildPasture();
    drawWheat();
    buildThorfinn();
    buildIro();
    drawRocks();
    drawSea();
    buildKale();
    drawHill();
    if (new URLSearchParams(location.search).get('evening')) { state.nanamin.stage = 4; state.time.phase = 'evening'; } // служебное: сразу вечер
    buildTimeLayer();

    player = makeChar({ skin: 0xF5CBA7, dress: 0x4DA3D9, hair: 'pony', hairColor: 0xA8502A });
    const p = walkable(state.pos.x, state.pos.y) ? state.pos : { x: 300, y: 430 };
    player.setPosition(p.x, p.y);

    if (!state.open.kuryatnik) makeLock('kuryatnik', [708, 0, OZERO_X - 708, 488], 'Курятник', 'Откроется по ходу игры');
    if (!state.open.skaly) makeLock('skaly', [OZERO_X + 8, 0, WORLD.w - OZERO_X - 8, 984], 'Скалы', 'Откроется по ходу игры');
    if (!state.open.sad) makeLock('sad', [700, 504, OZERO_X - 700, 496], 'Сад', 'Будет в полной версии');

    // маркер «!» над целью задания
    marker = this.add.container(0, 0).setDepth(6000);
    const mg = this.add.graphics();
    mg.fillStyle(0xE2553A, 1).fillCircle(0, 0, 15).lineStyle(3, 0x5B3A1E, 1).strokeCircle(0, 0, 15);
    mg.fillStyle(0xE2553A, 1).fillTriangle(-7, 11, 7, 11, 0, 21);
    const mt = this.add.text(0, 1, '!', { fontFamily: 'Fredoka, Nunito, sans-serif', fontStyle: '600', fontSize: '22px', color: '#FFFFFF', resolution: 3 }).setOrigin(0.5);
    marker.add([mg, mt]);

    const cam = this.cameras.main;
    cam.setBounds(WORLD.x, WORLD.top, WW, WORLD.h);
    fitCamera();
    // камера держит героиню ровно по центру (без «догоняния»): при плавном догонянии кадры на телефоне
    // идут неравномерно, и фон двигался рывками — трава «дрожала»
    cam.startFollow(player, false, 1, 1);
    // камера и картинки встают ровно на пиксели экрана: иначе при движении мелкий узор травы
    // каждый кадр пересчитывается со сдвигом на долю пикселя и «дрожит»
    cam.setRoundPixels(true);
    cam.centerOn(player.x, player.y);
    // Служебный режим ?overview — вся карта целиком, без интерфейса (для скриншотов в Figma)
    if (OVERVIEW) {
      cam.stopFollow();
      fitCamera();
      cam.centerOn(WORLD.x + WW / 2, WORLD.top + WORLD.h / 2);
      document.body.classList.add('overview');
      Object.values(lockLayers).forEach(l => l.setAlpha(0.35));
    }

    // Служебные параметры для скриншотов: ?pos=x,y&seen=1&stage=N&act=id
    const q = new URLSearchParams(location.search);
    if (q.get('pos')) { const [px, py] = q.get('pos').split(',').map(Number); player.setPosition(px, py); cam.centerOn(px, py); }
    if (q.get('seen')) state.nanamin.seen = true;
    if (q.get('stage')) { state.nanamin.stage = +q.get('stage'); }
    if (q.get('walk')) document.title = 'WALK:' + q.get('walk').split(';').map(p => walkable(...p.split(',').map(Number)) ? 1 : 0).join('');   // служебное: проверка проходимости
    if (q.get('tools')) { state.nanamin.tools = +q.get('tools'); }   // служебное: этап с инструментами
    if (q.get('barn')) { state.nanamin.barn = { round1: true, helped: q.get('barn') }; }   // служебное: второй заход в амбар (zmey | solo)
    if (q.get('act')) setTimeout(() => interact(q.get('act')), 600);
    bakeBigGraphics(); cullStatic(); updateCull(0, true);   // сразу — по уже известной позиции героини

    updateHud();
    releaseStick();
    $('loading').hidden = true;
    if (state.step === 0) this.time.delayedCall(700, () => toast('Коснись экрана и веди пальцем, чтобы идти', 'info'));
  }

  update(time, dt) {
    let moving = false;
    const v = ui.open ? { x: 0, y: 0 } : inputVector();
    const mag = Math.hypot(v.x, v.y);
    if (mag > 0.05) {
      // скорость зависит от наклона джойстика; полная — с 70% наклона
      const sp = (barn.active && barn.carry ? 205 : 240) * Math.min(1, mag / 0.7) * Math.min(dt, 50) / 1000;
      const ux = v.x / mag, uy = v.y / mag;
      const nx = player.x + ux * sp, ny = player.y + uy * sp;
      if (Math.abs(ux) > 0.2) facing = ux < 0 ? -1 : 1;
      if (walkable(nx, ny)) { player.setPosition(nx, ny); moving = true; }
      else if (Math.abs(ux) > 0.1 && walkable(nx, player.y)) { player.x = nx; moving = true; }
      else if (Math.abs(uy) > 0.1 && walkable(player.x, ny)) { player.y = ny; moving = true; }
      else {   // упёрлись в угол: ищем щель рядом и соскальзываем в неё (поперёк движения)
        const px = -uy, py = ux;
        for (const k of [1, -1, 2, -2]) {
          const tx = player.x + px * sp * k + ux * sp * 0.3, ty = player.y + py * sp * k + uy * sp * 0.3;
          if (walkable(tx, ty)) { player.setPosition(tx, ty); moving = true; break; }
        }
      }
    }

    player.setDepth(playerDepth(player.x, player.y));
    player.bodyG.scaleX = facing;
    player.bodyG.y = moving && !REDUCED ? -Math.abs(Math.sin(time / 85)) * 3 : 0;
    this.npcs.forEach((n, i) => { n.bodyG.y = REDUCED ? 0 : Math.sin(time / 500 + i) * 1.2; });
    chickens.forEach(c => c.setDepth(c.y));
    updateCull(dt);
    updatePasture(dt);
    updateField();
    updateThorfinn(dt);
    if (barn.active) updateBarn(dt, time);

    const id = questTarget();
    if (id && id !== nearId) { // когда над целью облачко, «!» прячем
      const a = ANCHORS[id];
      marker.setVisible(true).setPosition(a.x, a.y + a.mark + (REDUCED ? 0 : Math.sin(time / 220) * 5));
    } else marker.setVisible(false);

    updateGuide();
    updateControls();
    saveMs += dt;
    if (saveMs > 2000) { saveMs = 0; save(); }
  }
}

// ===================== Запуск =====================
function boot() {
  const W = app.clientWidth, H = app.clientHeight;
  game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    backgroundColor: '#4F8A3A',
    banner: false,
    input: { activePointers: 1 },
    scale: { mode: Phaser.Scale.NONE, width: Math.round(W * DPR), height: Math.round(H * DPR), zoom: 1 / DPR },
    scene: FarmScene,
    // для травы (картинка 1024×1024) строятся уменьшенные копии: на экране она мельче оригинала,
    // и без них мелкие травинки мерцают при движении
    render: { mipmapFilter: 'LINEAR_MIPMAP_LINEAR' },
  });
  if ('ResizeObserver' in window) new ResizeObserver(resizeGame).observe(app);
  window.addEventListener('resize', resizeGame);
}
const fontsReady = document.fonts
  ? Promise.all([document.fonts.load('800 16px Nunito'), document.fonts.load('600 22px Fredoka')]).catch(() => {})
  : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 1500))]).then(boot);

// Офлайн-режим и установка на телефон (PWA)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
