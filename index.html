<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ферма</title>
<meta name="theme-color" content="#4F8A3A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ферма">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: full-bleed game canvas; quest card top-left, bag top-right, dialog sheet bottom, modals centered */
:root{
  --grass-deep:#4F8A3A;
  --wood:#5B3A1E;
  --paper:#FFFDF4;
  --ink:#2E2418;
  --muted:#7A6A55;
  --tomato:#E2553A;
  --leaf:#3E8E41;
  --sky:#4DA3D9;
  --straw:#E9C77B;
  --display:"Fredoka","Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--grass-deep);color:var(--ink);font-family:var(--body);font-size:17px;overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#game{position:absolute;inset:0}
#game canvas{display:block;touch-action:none}

.hud{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.quest{background:var(--paper);border:3px solid var(--wood);border-radius:14px;padding:8px 14px 10px;max-width:min(340px,64vw);
  box-shadow:0 4px 0 rgba(46,36,24,.35);display:flex;flex-direction:column;gap:2px}
.quest .label{font-size:15px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tomato)}
.quest .text{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.2;text-wrap:balance}
.quest .sub{margin-top:6px;padding-top:6px;border-top:2px dashed #D9CBA8;font-family:var(--display);font-size:17px;font-weight:600;line-height:1.2;color:#3E5A7A}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:auto}
.bag{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--wood);border-radius:999px;padding:3px 12px 3px 6px;
  font-weight:800;font-size:16px;box-shadow:0 2px 0 rgba(46,36,24,.3);animation:pop .35s ease-out}
.chip i{width:20px;height:20px;border-radius:50%;border:2px solid var(--wood);display:block}
.ghost-btn{font-family:var(--body);font-weight:800;font-size:16px;color:var(--ink);background:rgba(255,253,244,.85);border:2px solid var(--wood);
  border-radius:999px;padding:5px 12px;cursor:pointer}
.ghost-btn:focus-visible,.btn:focus-visible,.nest:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

.guide{position:absolute;left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;pointer-events:none;
  background:var(--tomato);border:3px solid var(--wood);border-radius:50%;display:grid;place-items:center;box-shadow:0 3px 0 rgba(46,36,24,.35)}
.guide span{display:block;width:0;height:0;border-top:8px solid transparent;border-bottom:8px solid transparent;border-left:13px solid #fff;margin-left:3px}

.toast{position:absolute;left:50%;top:118px;transform:translate(-50%,-8px);max-width:calc(100% - 32px);text-align:center;
  background:var(--leaf);color:#fff;font-family:var(--display);font-weight:600;font-size:19px;padding:9px 18px;border-radius:14px;
  border:3px solid var(--wood);box-shadow:0 4px 0 rgba(46,36,24,.35);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.info{background:var(--paper);color:var(--ink)}
.toast.show{opacity:1;transform:translate(-50%,0)}

.sheet{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:10px;
  margin-inline:auto;max-width:640px;background:var(--paper);border:3px solid var(--wood);border-radius:18px;padding:14px 16px;
  display:flex;gap:14px;align-items:flex-start;box-shadow:0 5px 0 rgba(46,36,24,.4);cursor:pointer;animation:rise .25s ease-out}
.portrait{flex:none;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;
  font-size:30px;color:#fff;border:3px solid var(--wood)}
.say{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.who{font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted)}
.line{font-size:18px;line-height:1.4;min-height:2.8em}
.actions{display:flex;justify-content:flex-end;gap:8px}
.btn{font-family:var(--display);font-size:18px;font-weight:600;background:var(--tomato);color:#fff;border:3px solid var(--wood);
  border-radius:12px;padding:8px 18px;box-shadow:0 3px 0 var(--wood);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood)}
.btn.secondary{background:var(--paper);color:var(--ink)}
/* Окно мыслей героини: светлее, пунктирная рамка, курсив */
.sheet.thought{background:#F1F6FA;border-style:dashed;border-color:#5C7A93}
.sheet.thought .line{font-style:italic;color:#34465A}
.sheet.thought .portrait{border-style:dashed}
/* Выбор вариантов в разговоре */
.actions.choices{flex-direction:column;align-items:stretch}
.actions.choices .btn{font-size:17px;text-align:left}

.modal{position:absolute;inset:0;background:rgba(28,40,18,.55);display:grid;place-items:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.card{background:var(--paper);border:3px solid var(--wood);border-radius:20px;padding:18px;width:min(420px,100%);
  display:flex;flex-direction:column;gap:12px;text-align:center;box-shadow:0 6px 0 rgba(46,36,24,.45);animation:pop .3s ease-out;
  max-height:100%;overflow:auto}
.card h2{font-family:var(--display);font-weight:600;font-size:26px;margin:0;text-wrap:balance}
.card p{margin:0;line-height:1.45;font-size:17px}
.badge{align-self:center;font-size:15px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--tomato)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mg-stats{display:flex;justify-content:space-between;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:12px;border-radius:999px;background:#EADFC8;border:2px solid var(--wood);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .2s}
.nests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;width:100%;margin-inline:auto}
.nest{position:relative;aspect-ratio:1;border-radius:50%;padding:0;cursor:pointer;border:3px solid var(--wood);
  background:radial-gradient(circle at 50% 60%,#8A5A33 0 34%,var(--straw) 36% 100%)}
.nest .egg{position:absolute;left:50%;top:50%;width:40%;height:50%;transform:translate(-50%,-58%) scale(0);
  background:#FFF6E3;border:3px solid #C9A46B;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;transition:transform .14s ease-out}
.nest.has .egg{transform:translate(-50%,-58%) scale(1)}
.nest.gold .egg{background:#FFD447;border-color:#C79A12}

.info{display:flex;flex-direction:column;gap:12px}

/* Джойстик и кнопка действия */
.stick-zone{position:absolute;inset:0;touch-action:none}
.stick{position:absolute;left:0;top:0;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;
  background:rgba(255,253,244,.22);border:3px solid rgba(255,253,244,.75);pointer-events:none;transition:opacity .2s}
.stick.idle{opacity:.4}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:var(--paper);border:3px solid var(--wood);box-shadow:0 3px 0 rgba(46,36,24,.35)}
/* Облачко действия над персонажем или предметом */
.bubble{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--display);font-weight:600;font-size:18px;color:#fff;
  background:var(--tomato);border:3px solid var(--wood);border-radius:14px;padding:8px 16px;box-shadow:0 3px 0 var(--wood);cursor:pointer}
.bubble::after{content:"";position:absolute;left:50%;bottom:-12px;margin-left:-9px;border:9px solid transparent;border-top-color:var(--wood);border-bottom:0}
.bubble:active{box-shadow:0 1px 0 var(--wood);background:#C9472F}
.bubble:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.off{visibility:hidden}
body.overview .hud, body.overview .stick-zone, body.overview .guide, body.overview .toast, body.overview .bubble, body.overview .rotate{display:none!important}

/* Просьба повернуть телефон */
.rotate{position:absolute;inset:0;z-index:10;display:none;place-items:center;align-content:center;gap:16px;text-align:center;
  background:var(--grass-deep);color:#fff;padding:24px;font-family:var(--display);font-weight:600;font-size:22px}
.rotate .phone{width:52px;height:88px;border:4px solid #fff;border-radius:12px;animation:turn 2.4s ease-in-out infinite}
@keyframes turn{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
@media (orientation:landscape) and (pointer:coarse) and (max-height:600px){.rotate{display:grid}}

/* Горизонтальный телефон: невысокий экран */
@media (max-height:500px){
  .card.mg{width:min(680px,100%);display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;text-align:left}
  .card.mg .badge{align-self:flex-start}
  .card.mg .nests{width:min(280px,62vh)}
  .card.mg .row{justify-content:flex-start}
  .toast{top:96px}
}

/* Затемнение экрана при смене дня */
.fade{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:#141826;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
.fade.show{opacity:1;pointer-events:auto}
.fade-text{font-family:var(--display);font-weight:600;font-size:46px;color:#FFF3D6;letter-spacing:.02em;opacity:0;transition:opacity .8s ease .4s}
.fade.show .fade-text{opacity:1}

.loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--grass-deep);color:#fff;font-family:var(--display);font-size:22px}

@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="game"></div>
  <div class="stick-zone" id="stickZone"><div class="stick idle" id="stick"><div class="knob" id="knob"></div></div></div>
  <div class="hud">
    <div class="quest"><div class="label" id="questLabel">Задание</div><div class="text" id="questText"></div><div class="sub" id="sideQuest" hidden></div></div>
    <div class="side"><button class="ghost-btn" id="resetBtn" type="button">Заново</button><button class="ghost-btn" id="skipBtn" type="button" hidden>Пропустить квест</button><div class="bag" id="bag"></div></div>
  </div>
  <button class="bubble" id="bubble" type="button" hidden></button>
  <div class="guide" id="guide" hidden><span></span></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sheet" id="sheet" hidden>
    <div class="portrait" id="portrait"></div>
    <div class="say">
      <div class="who" id="who"></div>
      <div class="line" id="line"></div>
      <div class="actions"><button class="btn" id="nextBtn" type="button">Дальше</button></div>
    </div>
  </div>
  <div class="modal" id="modal" hidden></div>
  <div class="fade" id="fade"><div class="fade-text" id="fadeText"></div></div>
  <div class="rotate"><div class="phone"></div><div>Поверни телефон вертикально</div></div>
  <div class="loading" id="loading">Загружаем ферму…</div>
</div>

<script src="lib/phaser.min.js"></script>
<script>
// ===================== Общие настройки =====================
const DPR = Math.min(window.devicePixelRatio || 1, 3);
const GAME_VERSION = 18;   // совпадает с номером в sw.js (farm-vN); видно в окне «Заново»
// Слои земли (трава, дорожки, поля, тени) — глубже любых персонажей и деревьев, даже с отрицательной y
const GROUND = -5000;
// Карта: y от −1000 до 2000. Верх (y < 0) — поле с пшеницей, низ (y > 1000) — пастбище Нанамина
const WORLD = { w: 1400, top: -1000, h: 3000 };
const SAVE_KEY = 'farm-prototype-v1';
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const app = $('app');

const ZONES = {
  ogorod:    { name: 'Огород' },
  kuryatnik: { name: 'Курятник' },
  sad:       { name: 'Сад' },
  pastbishe: { name: 'Пастбище' },
  pole:      { name: 'Поле' },
};
const zoneAt = (x, y) => y < 0 ? 'pole' : y >= 1000 ? 'pastbishe' : x < 700 ? 'ogorod' : (y < 500 ? 'kuryatnik' : 'sad');

const SPEAKERS = {
  grandpa: { name: 'Дедушка', letter: 'Д', color: '#B5563A' },
  klara: { name: 'Клара',          letter: 'К', color: '#D99A1E' },
  nanamin: { name: 'Нанамин',      letter: 'Н', color: '#5B7FA6' },
  thorfinn: { name: 'Торфинн',     letter: 'Т', color: '#C9A55A' },
  thought: { name: 'Мысли героини', letter: '…', color: '#8FB3C9', thought: true },
};

// Пастбище: загон для коров (сломан в 3 местах), Нанамин рядом, 4 коровы бродят по пастбищу
const PEN = { x: 200, y: 1400, w: 360, h: 240, gateX1: 330, gateX2: 400 };
const PEN_SPOTS = [{ x: 200, y: 1500 }, { x: 420, y: 1640 }, { x: 560, y: 1470 }];
const COW_HOMES = [{ x: 1080, y: 1200 }, { x: 930, y: 1720 }, { x: 330, y: 1880 }, { x: 1250, y: 1600 }];

const BEDS = [{ x: 290, y: 600 }, { x: 410, y: 600 }, { x: 530, y: 600 }];

// Точки, к которым героиня подходит, и дистанция, с которой срабатывает действие
const ANCHORS = {
  grandpa: { x: 300, y: 330, reach: 72, mark: -118 },
  well:    { x: 140, y: 560, reach: 92, mark: -92 },
  bed0:    { ...BEDS[0], reach: 62, mark: -50 },
  bed1:    { ...BEDS[1], reach: 62, mark: -50 },
  bed2:    { ...BEDS[2], reach: 62, mark: -50 },
  gate:    { x: 700, y: 250, reach: 64, mark: -72 },
  klara:   { x: 940, y: 320, reach: 72, mark: -118 },
  nanamin: { x: 640, y: 1560, reach: 72, mark: -118 },
  door:    { x: 210, y: 280, reach: 62, mark: -100 },   // дверь дома дедушки (вечером — «Лечь спать»)
  fieldGate: { x: 588, y: -40, reach: 0, mark: -50 },   // проход в поле (только цель для маркера)
  thorfinn: { x: 650, y: -530, reach: 72, mark: -118 }, // пост Торфинна у перекрёстка в поле (сам он двигается)
  pen0:    { ...PEN_SPOTS[0], reach: 64, mark: -60 },
  pen1:    { ...PEN_SPOTS[1], reach: 64, mark: -60 },
  pen2:    { ...PEN_SPOTS[2], reach: 64, mark: -60 },
};
// Точка цели: у коров она двигается вместе с ними
function anchorOf(id) {
  if (id && id.startsWith('cow')) { const c = cows[+id.slice(3)]; return { x: c.x, y: c.y, reach: 64, mark: -52 }; }
  if (id === 'thorfinn' && thorfinnChar) return { x: thorfinnChar.x, y: thorfinnChar.y, reach: 72, mark: -118 };
  return ANCHORS[id];
}

// ===================== Сохранение =====================
const freshState = () => ({
  step: 0,
  items: { can: false, key: false, eggs: 0 },
  watered: [false, false, false],
  open: { ogorod: true, kuryatnik: false, sad: false, pastbishe: true, pole: true }, // пастбище и поле пока открыты сразу — для тестов
  pos: { x: 300, y: 430 },
  // квест Нанамина: stage 0 — не знаем о нём, 1 — чиним загон, 2 — собираем коров, 3 — можно поговорить, 4 — готово
  nanamin: { seen: false, stage: 0, fixed: [false, false, false], cows: [0, 0, 0, 0], visited: false },
  // время суток меняется по сюжету: day → evening (после квеста Нанамина) → сон → morning → day
  time: { day: 1, phase: 'day' },
  // день 2: stage 0 — ещё не начался, 1 — дед попросил помочь в поле, 2 — героиня пришла в поле
  day2: { stage: 0, visitedField: false },
});
function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const s = JSON.parse(raw), d = freshState();
      return { ...d, ...s, items: { ...d.items, ...s.items }, open: { ...d.open, ...s.open }, nanamin: { ...d.nanamin, ...s.nanamin }, time: { ...d.time, ...s.time }, day2: { ...d.day2, ...s.day2 } };
    }
  } catch (e) {}
  return freshState();
}
let state = loadState();
function save() {
  try {
    if (player) state.pos = { x: Math.round(player.x), y: Math.round(player.y) };
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
  } catch (e) {}
}

// ===================== Интерфейс (HTML поверх игры) =====================
const ui = { open: false };

function questTarget() {
  if (state.time.phase === 'evening') return 'door';   // вечером ведём героиню домой спать
  if (state.day2.stage === 1) return 'fieldGate';      // день 2: в поле
  switch (state.step) {
    case 0: case 3: case 7: return 'grandpa';
    case 1: return 'well';
    case 2: { const i = state.watered.findIndex(w => !w); return i < 0 ? null : 'bed' + i; }
    case 4: return 'gate';
    case 5: case 6: return 'klara';
    default: return null;
  }
}
function questText() {
  const n = state.watered.filter(Boolean).length;
  return [
    'Поговори с дедушкой',
    'Возьми лейку у колодца',
    `Полей грядки: ${n} из 3`,
    'Вернись к дедушке',
    'Открой калитку в курятник',
    'Познакомься с Кларой',
    'Собери яйца для Клары',
    'Отнеси корзину яиц дедушке',
    'Прототип пройден. Можно гулять по ферме',
  ][state.step] || '';
}
function updateHud() {
  const d2 = state.day2.stage;
  $('questLabel').textContent = d2 ? 'Задание · день 2' : state.step >= 8 ? 'Готово' : 'Задание';
  $('questText').textContent = d2 === 1 ? 'Сходи в поле за домом дедушки и помоги людям'
    : d2 === 2 ? 'Найди в поле людей, которым нужна помощь' : questText();
  const chips = [];
  if (state.items.can) chips.push(['Лейка', '#4DA3D9']);
  if (state.items.key && !state.open.kuryatnik) chips.push(['Ключ', '#E9B94A']);
  if (state.step === 7) chips.push([`Яйца × ${state.items.eggs}`, '#FFF6E3']);
  if (state.time.day > 1 || state.time.phase !== 'day') {
    const sky = { day: '#9FD3F0', evening: '#F2A66B', morning: '#F7D9C4' }[state.time.phase] || '#9FD3F0';
    chips.unshift([`День ${state.time.day}`, sky]);
  }
  $('bag').innerHTML = chips.map(([t, c]) => `<span class="chip"><i style="background:${c}"></i>${t}</span>`).join('');
  // второе задание — квест Нанамина
  const nm = state.nanamin, side = $('sideQuest');
  const sideText = {
    1: `Почини загон Нанамина: ${nm.fixed.filter(Boolean).length} из 3`,
    2: `Загони коров Нанамина: ${nm.cows.filter(c => c === 2).length} из 4`,
    3: 'Поговори с Нанамином',
  }[nm.stage] || (state.time.phase === 'evening' ? 'Вечереет: вернись домой и ложись спать' : null);
  side.hidden = !sideText;
  if (sideText) side.textContent = sideText;
  $('skipBtn').hidden = nm.stage >= 3;   // ВРЕМЕННО: кнопка для теста смены дня
}
function progress() { save(); updateHud(); }

let toastTimer;
function toast(msg, kind) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast' + (kind ? ' ' + kind : ''); }, 2400);
}

// --- Диалоги ---

// ===================== Мини-игра «Собери яйца» =====================
function eggGame(onWin) {
  const GOAL = 8, TIME = 20;
  openModal(`<div class="card mg">
    <div class="info">
      <div class="badge">Мини-игра</div>
      <h2>Собери яйца</h2>
      <p>Нажимай на яйца, пока куры их не спрятали. Золотое считается за два.</p>
      <div class="mg-stats"><span>Яйца: <b id="mgCount">0</b> из ${GOAL}</span><span>Время: <b id="mgTime">${TIME}</b> с</span></div>
      <div class="bar"><i id="mgBar"></i></div>
      <div class="row"><button class="btn" id="mgStart" type="button">Начать</button></div>
    </div>
    <div class="nests" id="nests">${Array.from({ length: 9 }, (_, i) => `<button class="nest" type="button" data-i="${i}" aria-label="Гнездо ${i + 1}"><span class="egg"></span></button>`).join('')}</div>
  </div>`);
  const nests = [...document.querySelectorAll('.nest')];
  let count = 0, left = TIME, running = false, tick = null, spawnAcc = 0;
  const life = new Array(9).fill(0);

  const paint = () => {
    $('mgCount').textContent = Math.min(count, GOAL);
    $('mgTime').textContent = Math.ceil(left);
    $('mgBar').style.width = Math.min(100, count / GOAL * 100) + '%';
  };
  nests.forEach((n, i) => n.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!running || !n.classList.contains('has')) return;
    count += n.classList.contains('gold') ? 2 : 1;
    n.classList.remove('has', 'gold'); life[i] = 0;
    paint();
    if (count >= GOAL) finish(true);
  }));

  function start() {
    $('mgStart').closest('.row').hidden = true;
    running = true; count = 0; left = TIME; paint();
    tick = setInterval(() => {
      left -= 0.1;
      const t = 1 - left / TIME;
      // яйца появляются всё чаще и прячутся быстрее
      spawnAcc += 100;
      if (spawnAcc >= 760 - t * 280) {
        spawnAcc = 0;
        const free = nests.map((n, i) => i).filter(i => !nests[i].classList.contains('has'));
        if (free.length) {
          const i = free[Math.floor(Math.random() * free.length)];
          nests[i].classList.add('has');
          if (Math.random() < 0.15) nests[i].classList.add('gold');
          life[i] = 1300 - t * 450;
        }
      }
      nests.forEach((n, i) => {
        if (life[i] > 0) { life[i] -= 100; if (life[i] <= 0) n.classList.remove('has', 'gold'); }
      });
      paint();
      if (left <= 0) finish(false);
    }, 100);
  }
  function finish(win) {
    running = false; clearInterval(tick);
    if (win) {
      openModal(`<div class="card"><div class="badge">Получилось</div><h2>Корзина полна!</h2>
        <p>Восемь яиц собраны. Клара будет довольна.</p>
        <div class="row"><button class="btn" id="mgOk" type="button">Отдать Кларе</button></div></div>`);
      $('mgOk').onclick = () => { closeModal(); onWin(Math.max(count, GOAL)); };
    } else {
      openModal(`<div class="card"><div class="badge">Почти</div><h2>Собрано ${count} из ${GOAL}</h2>
        <p>Куры оказались быстрее. Попробуем ещё раз?</p>
        <div class="row"><button class="btn secondary" id="mgLater" type="button">Позже</button>
        <button class="btn" id="mgAgain" type="button">Ещё раз</button></div></div>`);
      $('mgLater').onclick = () => { closeModal(); toast('Клара подождёт. Подойди к ней, когда будешь готова', 'info'); };
      $('mgAgain').onclick = () => { closeModal(); eggGame(onWin); };
    }
  }
  $('mgStart').onclick = start;
}

// ===================== Время суток =====================
// Цветной фильтр поверх всей фермы: вечер — тёплый закат, утро — мягкий розоватый свет
// Вечер = тёплый закат (умножение) + полупрозрачная сине-сиреневая дымка сумерек поверх
const TINTS = {
  evening: { color: 0xE58C58, alpha: 0.62, haze: 0x3E4C92, hazeAlpha: 0.2 },   // тёплый закат + немного синевы
  morning: { color: 0xF6C7B4, alpha: 0.3 },
};
let timeTint = null, timeHaze = null, windowGlow = null, fireflies = [];
function buildTimeLayer() {
  timeTint = scene.add.rectangle(0, WORLD.top, WORLD.w, WORLD.h, 0xffffff).setOrigin(0, 0).setDepth(5800).setAlpha(0);
  timeTint.setBlendMode(Phaser.BlendModes.MULTIPLY);
  timeHaze = scene.add.rectangle(0, WORLD.top, WORLD.w, WORLD.h, 0x3E4C92).setOrigin(0, 0).setDepth(5801).setAlpha(0);
  // тёплый свет в окнах дома дедушки
  windowGlow = scene.add.graphics().setDepth(5850).setAlpha(0).setBlendMode(Phaser.BlendModes.ADD);
  windowGlow.fillStyle(0xFFB040, 0.22).fillEllipse(138, 198, 100, 86).fillEllipse(282, 198, 100, 86);
  windowGlow.fillStyle(0xFFC864, 0.75).fillRect(118, 180, 40, 35).fillRect(262, 180, 40, 35);
  if (!scene.textures.exists('firefly')) {
    const t = scene.textures.createCanvas('firefly', 32, 32);
    const ctx = t.getContext();
    const grd = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grd.addColorStop(0, 'rgba(255,252,200,1)'); grd.addColorStop(0.25, 'rgba(230,255,140,0.9)'); grd.addColorStop(1, 'rgba(200,255,120,0)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, 32, 32); t.refresh();
  }
  fireflies = [];
  applyTime(true);
}
function applyTime(instant) {
  const ph = state.time.phase, t = TINTS[ph];
  if (t) timeTint.setFillStyle(t.color);
  const to = (obj, alpha, dur) => {
    scene.tweens.killTweensOf(obj);
    if (instant) obj.setAlpha(alpha); else scene.tweens.add({ targets: obj, alpha, duration: dur, ease: 'Sine.easeInOut' });
  };
  to(timeTint, t ? t.alpha : 0, ph === 'day' ? 6000 : 4000);
  if (t && t.haze) timeHaze.setFillStyle(t.haze);
  to(timeHaze, t && t.haze ? t.hazeAlpha : 0, 4000);
  to(windowGlow, ph === 'evening' ? 1 : 0, 3000);
  if (ph === 'evening') spawnFireflies(); else clearFireflies();
}
// Светлячки: мерцают и медленно летают над травой
// Появляются плавно, маленькими группками по 4–6 штук, одна группа за другой
function spawnFireflies() {
  if (fireflies.length) return;
  const rnd = mulberry32(99);
  // карта делится на участки (5 по ширине, по одному ряду на ~285 точек высоты), в каждом — своя группка
  const COLS = 5, ROWS = Math.round(WORLD.h / 285), cw = WORLD.w / COLS, ch = WORLD.h / ROWS;
  const cells = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) cells.push([c, r]);
  for (let i = cells.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [cells[i], cells[j]] = [cells[j], cells[i]]; }
  for (let g = 0; g < cells.length; g++) {
    const [c, r] = cells[g];
    const gx = (c + 0.15 + rnd() * 0.7) * cw, gy = WORLD.top + (r + 0.15 + rnd() * 0.7) * ch;
    const groupDelay = 1000 + g * 330 + rnd() * 300;        // группы зажигаются по очереди, в случайном порядке
    const n = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < n; i++) {
      const f = scene.add.image(gx + (rnd() - 0.5) * 140, gy + (rnd() - 0.5) * 100, 'firefly')
        .setDepth(5900).setBlendMode(Phaser.BlendModes.ADD).setScale(0.28 + rnd() * 0.22).setAlpha(0);
      fireflies.push(f);
      const drift = () => {
        if (!f.active) return;
        scene.tweens.add({ targets: f, x: f.x + (Math.random() - 0.5) * 100, y: f.y + (Math.random() - 0.5) * 70,
          duration: 2800 + Math.random() * 3200, ease: 'Sine.easeInOut', onComplete: drift });
      };
      drift();
      // плавно загорается, потом мягко мерцает
      scene.tweens.add({
        targets: f, alpha: 0.75, duration: 1800, delay: groupDelay + i * 220, ease: 'Sine.easeInOut',
        onComplete: () => {
          if (!f.active) return;
          scene.tweens.add({ targets: f, alpha: { from: 0.75, to: 0.2 }, duration: 900 + Math.random() * 900,
            yoyo: true, repeat: -1, hold: 300 + Math.random() * 700, repeatDelay: Math.random() * 1200, ease: 'Sine.easeInOut' });
        },
      });
    }
  }
}
function clearFireflies() {
  fireflies.forEach(f => { scene.tweens.killTweensOf(f); f.destroy(); });
  fireflies = [];
}
function startEvening() {
  state.time.phase = 'evening';
  progress();
  applyTime(false);
  setTimeout(() => showThought('Солнце садится… Уже вечер. Пора домой — отдохнуть после такого дня.'), 2600);
}
// Сон: экран гаснет → «День N» → утро у дома дедушки
function goToSleep() {
  ui.open = true; stopWalking();
  const fade = $('fade'), text = $('fadeText');
  text.textContent = 'Спокойной ночи…';
  fade.classList.add('show');
  setTimeout(() => { text.style.opacity = 0; }, 2000);
  setTimeout(() => {
    state.time.day += 1;
    state.time.phase = 'morning';
    player.setPosition(ANCHORS.door.x, ANCHORS.door.y + 30); facing = 1;
    scene.cameras.main.centerOn(player.x, player.y);
    applyTime(true);
    progress();
    text.textContent = `День ${state.time.day}`;
    text.style.opacity = '';
  }, 2800);
  setTimeout(() => {
    fade.classList.remove('show');
    ui.open = false;
    if (state.time.day === 2 && state.day2.stage === 0) {

function hitTest(x, y) {
  const near = (ax, ay, r) => (x - ax) ** 2 + (y - ay) ** 2 <= r * r;
  if (near(300, 295, 44)) return 'grandpa';
  if (state.open.kuryatnik && near(940, 285, 44)) return 'klara';
  if (near(140, 545, 56)) return 'well';
  for (let i = 0; i < 3; i++) if (Math.abs(x - BEDS[i].x) < 58 && Math.abs(y - BEDS[i].y) < 44) return 'bed' + i;
  if (!state.open.kuryatnik && x > 664 && x < 736 && y > 186 && y < 314) return 'gate';
  if (near(640, 1525, 44)) return 'nanamin';
  if (thorfinnChar && thor.mode === 'idle' && near(thorfinnChar.x, thorfinnChar.y - 35, 44)) return 'thorfinn';
  if (state.nanamin.stage === 1) for (let i = 0; i < 3; i++) if (!state.nanamin.fixed[i] && near(PEN_SPOTS[i].x, PEN_SPOTS[i].y, 50)) return 'pen' + i;
  for (const c of cows) if (!c.following && state.nanamin.cows[c.idx] !== 2 && near(c.x, c.y - 18, 34)) return 'cow' + c.idx;
  return null;
}

// Мягкие пятна поверх травы: разбивают повтор плитки
function breakRepetition() {
  const rnd = mulberry32(21);
  if (!scene.textures.exists('blob')) {
    const t = scene.textures.createCanvas('blob', 256, 256);
    const ctx = t.getContext();
    const grd = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.55, 'rgba(255,255,255,0.55)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, 256, 256); t.refresh();
  }
  // тёмные, золотистые и светлые пятна разного размера
  const tints = [[0x2F5A22, 0.22], [0x2F5A22, 0.16], [0xD9B45A, 0.16], [0xC8DC7A, 0.14]];
  for (let i = 0; i < Math.round(26 * WORLD.h / 1000); i++) {
    const [tint, a] = tints[i % tints.length];
    scene.add.image(rnd() * WORLD.w, WORLD.top + rnd() * WORLD.h, 'blob').setTint(tint).setAlpha(a)
      .setScale(1.2 + rnd() * 2.2, 0.8 + rnd() * 1.4).setRotation(rnd() * Math.PI).setDepth(GROUND - 11);
  }
  // Плоские листья-овалы убраны: они были в другом стиле, чем рисованная земля.
  // Опавшие листья добавим позже отдельными рисованными картинками.
}

// ===================== Дорожки из кусочков =====================
// Карта поделена на клетки CELL×CELL. В PATHS перечислены отрезки дорожек
// [колонка1, ряд1, колонка2, ряд2] — горизонтальные или вертикальные.
// Кусочки (углы, края, развилки) игра подбирает сама: у каждого кусочка 4 угла,
// каждый угол — клетка «дорожка» или «трава» (16 вариантов в atlas'е path-mask.png).
const CELL = 56;
const PATHS = [
  [3, 4, 3, 7],     // от дома дедушки вниз
  [3, 7, 10, 7],    // вдоль огорода
  [10, 4, 10, 7],   // вверх к калитке
  [10, 4, 18, 4],   // через калитку к курятнику
  [18, 4, 18, 11],  // вниз, к калитке в сад
  [10, 7, 11, 7],   // от поворота у огорода — на клетку вправо
  [11, 7, 11, 22],  // вниз, через проход в заборе — на пастбище
  [11, 22, 21, 22], // по пастбищу на восток, к полям
  [6, 22, 11, 22],  // на запад, к загону
  [6, 22, 6, 24],   // ко входу в загон
  [10, -15, 10, 3], // от калитки курятника вверх, через проход в заборе — в поле
  [2, -9, 21, -9],  // по полю поперёк, между участками пшеницы
];
const PATH_TILE = 160;          // размер кусочка в атласе, px
const DIRT_WORLD = 196;         // одна плитка земли = 196 точек карты
const PATH_RES = 2;             // во сколько раз чётче точек карты рисуем дорожку

function pathCells() {
  const set = new Set();
  for (const [c1, r1, c2, r2] of PATHS) {
    for (let c = Math.min(c1, c2); c <= Math.max(c1, c2); c++)
      for (let r = Math.min(r1, r2); r <= Math.max(r1, r2); r++) set.add(c + ',' + r);
  }
  return set;
}

function drawPaths() {
  const cells = pathCells();
  if (!cells.size) return;
  const list = [...cells].map(k => k.split(',').map(Number));
  const c0 = Math.min(...list.map(p => p[0])), c1 = Math.max(...list.map(p => p[0]));
  const r0 = Math.min(...list.map(p => p[1])), r1 = Math.max(...list.map(p => p[1]));
  // область, которую занимают кусочки (они сдвинуты на полклетки)
  const X0 = (c0 - 0.5) * CELL, Y0 = (r0 - 0.5) * CELL;
  const W = (c1 - c0 + 2) * CELL, H = (r1 - r0 + 2) * CELL;
  const has = (c, r) => cells.has(c + ',' + r) ? 1 : 0;
  const maskImg = scene.textures.get('pathMask').getSourceImage();
  const rimImg = scene.textures.get('pathRim').getSourceImage();
  const dirtImg = scene.textures.get('dirt').getSourceImage();

  // все кусочки дорожек: [x в атласе, y в атласе, x на карте, y на карте]
  const tiles = [];
  for (let j = r0; j <= r1 + 1; j++) {
    for (let i = c0; i <= c1 + 1; i++) {
      const idx = has(i - 1, j - 1) | has(i, j - 1) << 1 | has(i - 1, j) << 2 | has(i, j) << 3;
      if (!idx) continue;
      tiles.push([(idx % 4) * PATH_TILE, Math.floor(idx / 4) * PATH_TILE, (i - 0.5) * CELL, (j - 0.5) * CELL]);
    }
  }
  // старые слои дорожек (при «Начать заново»)
  scene.textures.getTextureKeys().filter(k => k.startsWith('pathLayer')).forEach(k => scene.textures.remove(k));

  // Рисуем дорожки кусками не больше ~1800 px: телефоны не умеют картинки больше 4096 px
  const CHUNK = 16 * CELL, tileSize = CELL * PATH_RES, step = DIRT_WORLD * PATH_RES;
  let n = 0;
  for (let cy = Y0; cy < Y0 + H; cy += CHUNK) {
    for (let cx = X0; cx < X0 + W; cx += CHUNK) {
      const ww = Math.min(CHUNK, X0 + W - cx), hh = Math.min(CHUNK, Y0 + H - cy);
      const mine = tiles.filter(([, , tx, ty]) => tx < cx + ww && tx + CELL > cx && ty < cy + hh && ty + CELL > cy);
      if (!mine.length) continue;
      const cw = Math.round(ww * PATH_RES), ch = Math.round(hh * PATH_RES);
      // 1) маска: где земля
      const mask = document.createElement('canvas'); mask.width = cw; mask.height = ch;
      const m = mask.getContext('2d');
      for (const [sx, sy, tx, ty] of mine) m.drawImage(maskImg, sx, sy, PATH_TILE, PATH_TILE, (tx - cx) * PATH_RES, (ty - cy) * PATH_RES, tileSize, tileSize);
      // 2) земля, привязанная к координатам карты, обрезанная по маске
      const key = 'pathLayer' + (n++);
      const tex = scene.textures.createCanvas(key, cw, ch);
      const ctx = tex.getContext();
      const startX = -((cx % DIRT_WORLD) + DIRT_WORLD) % DIRT_WORLD * PATH_RES;
      const startY = -((cy % DIRT_WORLD) + DIRT_WORLD) % DIRT_WORLD * PATH_RES;
      for (let y = startY; y < ch; y += step)
        for (let x = startX; x < cw; x += step) ctx.drawImage(dirtImg, x, y, step, step);
      ctx.globalCompositeOperation = 'destination-in';
      ctx.drawImage(mask, 0, 0);
      // 3) тонкая тёмная кромка по краю
      ctx.globalCompositeOperation = 'source-over';
      for (const [sx, sy, tx, ty] of mine) ctx.drawImage(rimImg, sx, sy, PATH_TILE, PATH_TILE, (tx - cx) * PATH_RES, (ty - cy) * PATH_RES, tileSize, tileSize);
      tex.refresh();
      scene.add.image(cx, cy, key).setOrigin(0, 0).setScale(1 / PATH_RES).setDepth(GROUND - 9);
    }
  }
}

const THOR_LEFT_LINES = [

function inWheat(x, y) { return WHEAT.some(([wx, wy, w, h]) => x > wx - 4 && x < wx + w + 4 && y > wy - 4 && y < wy + h + 4); }
function wheatExit(x, y) {
  const r = WHEAT.find(([wx, wy, w, h]) => x > wx - 4 && x < wx + w + 4 && y > wy - 4 && y < wy + h + 4);
  if (!r) return { x, y };
  const [wx, wy, w, h] = r, m = 26;
  const opts = [{ x: wx - m, y }, { x: wx + w + m, y }, { x, y: wy - m }, { x, y: wy + h + m }]
    .filter(p => walkable(p.x, p.y) && !inWheat(p.x, p.y));
  opts.sort((a, b) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y));
  return opts[0] || { x: ANCHORS.thorfinn.x, y: ANCHORS.thorfinn.y + 40 };
}
function setThorfinnMood(angry) {
  const x = thorfinnChar ? thorfinnChar.x : ANCHORS.thorfinn.x, y = thorfinnChar ? thorfinnChar.y : ANCHORS.thorfinn.y;
  const fx = thorfinnChar ? thorfinnChar.bodyG.scaleX : 1;
  if (thorfinnChar) { scene.npcs.splice(scene.npcs.indexOf(thorfinnChar), 1); thorfinnChar.destroy(); }
  thorfinnChar = makeChar({ ...THOR_LOOK, angry, calm: !angry });

function updateThorfinn(dt) {
  const t = thorfinnChar; if (!t) return;
  const step = sp => sp * Math.min(dt, 50) / 1000;
  const moveTo = (tx, ty, sp) => {
    const dx = tx - t.x, dy = ty - t.y, d = Math.hypot(dx, dy);
    if (d > 1) { const k = Math.min(1, step(sp) / d); t.x += dx * k; t.y += dy * k; if (Math.abs(dx) > 2) t.bodyG.scaleX = dx < 0 ? -1 : 1; }
    t.bodyG.y = REDUCED ? 0 : -Math.abs(Math.sin(scene.time.now / 70)) * 3;
    return d;
  };
  if (!ui.open) {
    if ((thor.mode === 'idle' || thor.mode === 'return') && inWheat(player.x, player.y)) {
      if (thor.mode === 'idle') setThorfinnMood(true);
      thor.mode = 'chase';
      toast('Торфинн: «Эй! А ну стой!»', 'info');
    }
    if (thor.mode === 'chase') {
      if (!inWheat(player.x, player.y)) {
        thor.mode = 'return'; toast(`Торфинн: «${THOR_LEFT_LINES[thor.lefts++ % THOR_LEFT_LINES.length]}»`, 'info');
      } else if (moveTo(player.x + (player.x < thorfinnChar.x ? 30 : -30), player.y, 300) < 14) {
        thor.mode = 'scold';
        thorfinnChar.bodyG.scaleX = player.x < thorfinnChar.x ? -1 : 1;
        showDialog([['thorfinn', THOR_LINES[thor.scolds % THOR_LINES.length]]], () => {
          const p = wheatExit(player.x, player.y);
          ui.open = true;
          scene.tweens.add({ targets: player, x: p.x, y: p.y, duration: 450, ease: 'Quad.easeOut', onComplete: () => {
            ui.open = false; thor.mode = 'return';
            if (thor.scolds++ === 0) showThought('Ой… Похоже, по полю лучше не ходить — только по дорожкам.');
          } });
        });
      }
    }
    if (thor.mode === 'return' && moveTo(ANCHORS.thorfinn.x, ANCHORS.thorfinn.y, 160) < 3) {
      thor.mode = 'idle'; setThorfinnMood(false);
    }
  }
  thorfinnChar.setDepth(thorfinnChar.y);
  thorfinnLabel.setPosition(thorfinnChar.x, thorfinnChar.y - 78).setDepth(4000);
}

      for (let px = x1; px <= x2; px += 40) g.fillStyle(POST, 1).fillRect(px - 4, yy - 22, 8, 26);

        // сломано: перекладины вывалились, одна доска лежит на земле
        g.fillStyle(OLD, 1).fillRect(x1, yy - 18, (x2 - x1) * 0.3, 5);
        g.fillStyle(OLD, 0.9).fillTriangle(x1 + 30, yy + 6, x2 - 20, yy - 2, x2 - 18, yy + 4);
      } else g.fillStyle(col, 1).fillRect(x1, yy - 18, x2 - x1, 5).fillRect(x1, yy - 8, x2 - x1, 5);
    };
    const vRail = (xx, y1, y2, broken, col) => {
      for (let py = y1; py <= y2; py += 40) g.fillStyle(POST, 1).fillRect(xx - 7, py - 4, 14, 12);
      if (broken) {
        g.fillStyle(OLD, 1).fillRect(xx - 3, y1, 6, (y2 - y1) * 0.25);
        g.fillStyle(OLD, 0.9).fillTriangle(xx + 6, y1 + 20, xx + 26, y2 - 6, xx + 18, y2);
      } else g.fillStyle(col, 1).fillRect(xx - 3, y1, 6, y2 - y1);
    };
    if (part === 'back') {
      hRail(x, gateX1, y, false, OLD); hRail(gateX2, x + w, y, false, OLD);
      g.fillStyle(POST, 1).fillRect(gateX1 - 6, y - 30, 12, 36).fillRect(gateX2 - 6, y - 30, 12, 36);
      // левая сторона: сломано в районе PEN_SPOTS[0]
      vRail(x, y, 1470, false, OLD); vRail(x, 1470, 1530, !fixed[0], fixed[0] ? NEW : OLD); vRail(x, 1530, y + h, false, OLD);
      // правая сторона: сломано в районе PEN_SPOTS[2]
      vRail(x + w, y, 1440, false, OLD); vRail(x + w, 1440, 1500, !fixed[2], fixed[2] ? NEW : OLD); vRail(x + w, 1500, y + h, false, OLD);
    } else {
      // нижняя сторона: сломано в районе PEN_SPOTS[1]
      hRail(x, 380, y + h, false, OLD); hRail(380, 460, y + h, !fixed[1], fixed[1] ? NEW : OLD); hRail(460, x + w, y + h, false, OLD);
    }
  };
  draw(penBackG, 'back'); draw(penFrontG, 'front');
}
// Коровы (пока простые, как куры; позже — рисованные)
function makeCow(i) {
  const home = COW_HOMES[i];
  const c = scene.add.container(home.x, home.y);
  const g = scene.add.graphics();
  g.fillStyle(0x1d2a12, 0.22).fillEllipse(0, 0, 54, 14);
  g.fillStyle(0x5A4636, 1).fillRect(-18, -12, 5, 12).fillRect(-8, -12, 5, 12).fillRect(6, -12, 5, 12).fillRect(14, -12, 5, 12);
  g.fillStyle(0xFAF6EE, 1).fillEllipse(0, -22, 50, 28);
  g.fillStyle(0x3A3027, 1).fillEllipse(-10, -26, 14, 10).fillEllipse(8, -18, 12, 9).fillEllipse(-2, -30, 8, 6);
  g.fillStyle(0xFAF6EE, 1).fillEllipse(26, -30, 18, 20);
  g.fillStyle(0xF2B5A6, 1).fillEllipse(31, -24, 12, 8);
  g.fillStyle(0x2e2418, 1).fillCircle(24, -34, 1.6).fillCircle(29, -34, 1.6);
  g.fillStyle(0xE8D9B5, 1).fillTriangle(19, -40, 22, -48, 24, -39).fillTriangle(29, -39, 33, -47, 34, -38);
  g.lineStyle(2, 0x5A4636, 1).lineBetween(-25, -24, -30, -12);
  c.add(g); c.g = g; c.idx = i; c.home = home; c.following = false;
  return c;
}
function cowWander(c) {
  const penned = state.nanamin.cows[c.idx] === 2;
  const nx = penned ? PEN.x + 40 + Math.random() * (PEN.w - 80) : c.home.x + (Math.random() - 0.5) * 220;
  const ny = penned ? PEN.y + 50 + Math.random() * (PEN.h - 80) : c.home.y + (Math.random() - 0.5) * 140;
  c.g.scaleX = nx < c.x ? -1 : 1;
  scene.tweens.add({
    targets: c, x: nx, y: Math.min(Math.max(ny, 1060), 1980), duration: 2500 + Math.random() * 3000, ease: 'Sine.easeInOut',
    onComplete: () => { if (!c.following) scene.time.delayedCall(800 + Math.random() * 2500, () => { if (!c.following) cowWander(c); }); },
  });
}
function setNanaminMood(sad) {
  const pos = { x: ANCHORS.nanamin.x, y: ANCHORS.nanamin.y };
  if (nanaminChar) { scene.npcs.splice(scene.npcs.indexOf(nanaminChar), 1); nanaminChar.destroy(); }
  nanaminChar = makeChar({ skin: 0xE9BC96, dress: 0x5B7FA6, suspenders: 0x3E5A7A, hair: 'short', hairColor: 0x3B2A20, sad });
  nanaminChar.setPosition(pos.x, pos.y).setDepth(pos.y);
  nanaminChar.bodyG.scaleX = -1;          // смотрит на загон
  scene.npcs.push(nanaminChar);
}
function dust(x, y) {
  for (let i = 0; i < 10; i++) {
    const d = scene.add.circle(x, y, 4, 0xD9C29A).setDepth(5900);
    const a = Math.random() * Math.PI * 2, r = 18 + Math.random() * 24;
    scene.tweens.add({ targets: d, x: x + Math.cos(a) * r, y: y + Math.sin(a) * r - 10, alpha: 0, duration: 520, onComplete: () => d.destroy() });
  }
}
function buildPasture() {
  drawFields();
  penBackG = scene.add.graphics().setDepth(PEN.y);
  penFrontG = scene.add.graphics().setDepth(PEN.y + PEN.h + 2);
  drawPen();
  setNanaminMood(state.nanamin.stage < 3);
  nameLabel('Нанамин', ANCHORS.nanamin.x, ANCHORS.nanamin.y - 78);
  cows.length = 0; followers.length = 0;
  for (let i = 0; i < 4; i++) {
    const c = makeCow(i);
    if (state.nanamin.cows[i] === 2) c.setPosition(PEN.x + 60 + i * 70, PEN.y + 120);
    cows.push(c); cowWander(c);
  }
  trig.pen = trig.nanamin = false;
}
// Каждый кадр: коровы идут за героиней, мысли у загона и у Нанамина
function updatePasture(dt) {
  const nm = state.nanamin;
  let lead = player;
  for (const c of [...followers]) {
    const dx = lead.x - c.x, dy = lead.y - c.y, d = Math.hypot(dx, dy);
    if (d > 46) {
      const sp = Math.min(d - 46, 210 * Math.min(dt, 50) / 1000);
      c.x += dx / d * sp; c.y += dy / d * sp;
      if (Math.abs(dx) > 2) c.g.scaleX = dx < 0 ? -1 : 1;
    }
    if (c.x > PEN.x + 20 && c.x < PEN.x + PEN.w - 20 && c.y > PEN.y + 30 && c.y < PEN.y + PEN.h - 10) { cowPenned(c); continue; }
    lead = c;
  }
  cows.forEach(c => c.setDepth(c.y));
  if (ui.open) return;
  // первый раз на пастбище
  if (!nm.visited && player.y > 1010) { nm.visited = true; save(); toast('Новая локация: Пастбище'); }
  // загон: мысли, пока о нём ничего не знаем
  const inPen = player.x > PEN.x - 50 && player.x < PEN.x + PEN.w + 50 && player.y > PEN.y - 50 && player.y < PEN.y + PEN.h + 50;
  const farPen = player.x < PEN.x - 110 || player.x > PEN.x + PEN.w + 110 || player.y < PEN.y - 110 || player.y > PEN.y + PEN.h + 110;
  if (nm.stage === 0 && inPen && !trig.pen && Math.hypot(player.x - ANCHORS.nanamin.x, player.y - ANCHORS.nanamin.y) > 90) { trig.pen = true; penThought(); }
  else if (farPen) trig.pen = false;
  // Нанамин: мысли, пока квест не выполнен
  const dN = Math.hypot(player.x - ANCHORS.nanamin.x, player.y - ANCHORS.nanamin.y);
  if (nm.stage < 3 && dN < 90 && !trig.nanamin) { trig.nanamin = true; nanaminThought(); }
  else if (dN > 140) trig.nanamin = false;
}

function makeLock(key, rect, title, sub) {
  const [x, y, w, h] = rect, cx = x + w / 2, cy = y + h / 2 - 10;
  const c = scene.add.container(0, 0).setDepth(5000);
  const g = scene.add.graphics();
  g.fillStyle(0x22331A, 0.62).fillRect(x, y, w, h);
  g.fillStyle(0xFFFDF4, 1).fillRoundedRect(cx - 24, cy - 8, 48, 38, 7);
  g.lineStyle(7, 0xFFFDF4, 1).beginPath().arc(cx, cy - 8, 15, Math.PI, 0).strokePath();
  g.fillStyle(0x22331A, 1).fillCircle(cx, cy + 8, 5).fillRect(cx - 2, cy + 8, 4, 12);
  const t1 = scene.add.text(cx, cy + 46, title, { fontFamily: 'Fredoka, Nunito, sans-serif', fontStyle: '600', fontSize: '28px', color: '#FFFDF4', resolution: 3 }).setOrigin(0.5, 0);
  const t2 = scene.add.text(cx, cy + 82, sub, { fontFamily: 'Nunito, sans-serif', fontStyle: '700', fontSize: '17px', color: '#E3EBD6', resolution: 3 }).setOrigin(0.5, 0);
  c.add([g, t1, t2]);
  lockLayers[key] = c;
}

function openKuryatnik() {
  state.open.kuryatnik = true; state.items.key = false; state.step = 5;
  drawGate();
  const lock = lockLayers.kuryatnik;
  if (lock) scene.tweens.add({ targets: lock, alpha: 0, duration: 700, onComplete: () => lock.destroy() });
  klara.setVisible(true).setScale(0.2); klaraLabel.setVisible(true);
  scene.tweens.add({ targets: klara, scale: 1, duration: 500, ease: 'Back.easeOut' });
  toast('Новая локация: Курятник!');
  progress();
}

// --- Эффекты ---
function splash(x, y) {
  for (let i = 0; i < 10; i++) {
    const d = scene.add.circle(x, y, 4, 0x6FB1E0).setDepth(5900);
    const a = Math.random() * Math.PI * 2, r = 20 + Math.random() * 26;
    scene.tweens.add({ targets: d, x: x + Math.cos(a) * r, y: y + Math.sin(a) * r - 14, alpha: 0, duration: 520, onComplete: () => d.destroy() });
  }
}


// --- Камера и размеры ---
const OVERVIEW = /[?&]overview/.test(location.search);
function fitCamera() {
  const cam = scene.cameras.main;
  const W = app.clientWidth, H = app.clientHeight;
  cam.setSize(Math.round(W * DPR), Math.round(H * DPR));
  if (OVERVIEW) { cam.setZoom(DPR * Math.min(W / WORLD.w, H / WORLD.h)); cam.centerOn(WORLD.w / 2, WORLD.top + WORLD.h / 2); return; }
  // на вертикальном телефоне чуть отдаляем камеру, чтобы по бокам было видно больше фермы
  const base = Math.min(W, H) < 500 ? (H > W ? 0.9 : 1) : 1.15;
  const cover = Math.max(W / WORLD.w, H / WORLD.h);
  cam.setZoom(DPR * Math.max(base, cover));
}
function resizeGame() {
  if (stick.id === null) idleStick();
  if (!game) return;
  const W = app.clientWidth, H = app.clientHeight;
  game.scale.resize(Math.round(W * DPR), Math.round(H * DPR));
  game.scale.setZoom(1 / DPR);
  if (scene && scene.cameras && scene.cameras.main) fitCamera();
}

// --- Подсказка-стрелка к цели задания за краем экрана ---
function updateGuide() {
  const el = $('guide');
  const id = questTarget();
  if (!id || ui.open) { el.hidden = true; return; }
  const a = ANCHORS[id], cam = scene.cameras.main, z = cam.zoom / DPR, wv = cam.worldView;
  const sx = (a.x - wv.x) * z, sy = (a.y - 40 - wv.y) * z;
  // стрелка нужна, только если цель за краем экрана; держим её ниже карточки задания
  const W = app.clientWidth, H = app.clientHeight, m = 34, top = 140;
  if (sx > m && sx < W - m && sy > m && sy < H - m) { el.hidden = true; return; }
  const cx = W / 2, cy = H / 2, dx = sx - cx, dy = sy - cy;
  const kx = dx ? ((dx > 0 ? W - m : m) - cx) / dx : Infinity;
  const ky = dy ? ((dy > 0 ? H - m : top) - cy) / dy : Infinity;
  const k = Math.min(kx, ky);
  el.style.transform = `translate(${cx + dx * k}px, ${cy + dy * k}px)`;
  el.firstElementChild.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
  el.hidden = false;
}

class FarmScene extends Phaser.Scene {
  constructor() { super('farm'); }
  preload() {
    this.load.image('grass', 'assets/ground/grass.jpg');
    this.load.image('dirt', 'assets/paths/dirt.jpg');
    this.load.image('pathMask', 'assets/paths/path-mask.png');
    this.load.image('pathRim', 'assets/paths/path-rim.png');
    TREE_FILES.forEach(([k, f]) => this.load.image(k, 'assets/trees/' + f));
  }
  create() {
    scene = this;
    lockLayers = {}; bedG = []; chickens.length = 0; nearId = null;

    drawGround();
    drawFences();
    drawHouse();
    drawWell();
    drawCoop();
    for (let i = 0; i < 3; i++) { bedG[i] = this.add.graphics().setDepth(1); drawBed(i); }
    PLANTS.forEach(([key, x, y, s]) => plant(key, x, y, s));

    for (let i = 0; i < 5; i++) { const ch = makeChicken(800 + i * 110, 300 + (i % 2) * 120); chickens.push(ch); wander(ch); }

    const grandpa = makeChar({ skin: 0xF0C29E, dress: 0xB5563A, suspenders: 0x3E5A7A, hair: 'grandpa', hairColor: 0xE4E0D8, cap: 0x6B4A2E, beard: true, glasses: true });
    grandpa.setPosition(300, 330).setDepth(330);
    nameLabel('Дедушка', 300, 252);

    klara = makeChar({ skin: 0xE8B48F, dress: 0x5E9E57, apron: 0xF7E3B5, hair: 'scarf', hairColor: 0xF2C94C });
    klara.setPosition(940, 320).setDepth(320).setVisible(state.open.kuryatnik);
    klara.bodyG.scaleX = -1;
    klaraLabel = nameLabel('Клара', 940, 242).setVisible(state.open.kuryatnik);
    this.npcs = [grandpa, klara];
    nanaminChar = null;
    buildPasture();
    drawWheat();
    buildThorfinn();
    if (new URLSearchParams(location.search).get('evening')) { state.nanamin.stage = 4; state.time.phase = 'evening'; } // служебное: сразу вечер
    buildTimeLayer();

    player = makeChar({ skin: 0xF5CBA7, dress: 0x4DA3D9, hair: 'pony', hairColor: 0xA8502A });
    const p = walkable(state.pos.x, state.pos.y) ? state.pos : { x: 300, y: 430 };
    player.setPosition(p.x, p.y);

    if (!state.open.kuryatnik) makeLock('kuryatnik', [708, 0, 692, 488], 'Курятник', 'Откроется по ходу игры');
    makeLock('sad', [700, 504, 700, 496], 'Сад', 'Будет в полной версии');

    // маркер «!» над целью задания
    marker = this.add.container(0, 0).setDepth(6000);
    const mg = this.add.graphics();
    mg.fillStyle(0xE2553A, 1).fillCircle(0, 0, 15).lineStyle(3, 0x5B3A1E, 1).strokeCircle(0, 0, 15);
    mg.fillStyle(0xE2553A, 1).fillTriangle(-7, 11, 7, 11, 0, 21);
    const mt = this.add.text(0, 1, '!', { fontFamily: 'Fredoka, Nunito, sans-serif', fontStyle: '600', fontSize: '22px', color: '#FFFFFF', resolution: 3 }).setOrigin(0.5);
    marker.add([mg, mt]);

    const cam = this.cameras.main;
    cam.setBounds(0, WORLD.top, WORLD.w, WORLD.h);
    fitCamera();
    cam.startFollow(player, false, 0.12, 0.12);
    cam.centerOn(player.x, player.y);
    // Служебный режим ?overview — вся карта целиком, без интерфейса (для скриншотов в Figma)
    if (OVERVIEW) {
      cam.stopFollow();
      fitCamera();
      cam.centerOn(WORLD.w / 2, WORLD.top + WORLD.h / 2);
      document.body.classList.add('overview');
      Object.values(lockLayers).forEach(l => l.setAlpha(0.35));
    }

    // Служебные параметры для скриншотов: ?pos=x,y&seen=1&stage=N&act=id
    const q = new URLSearchParams(location.search);
    if (q.get('pos')) { const [px, py] = q.get('pos').split(',').map(Number); player.setPosition(px, py); cam.centerOn(px, py); }
    if (q.get('seen')) state.nanamin.seen = true;
    if (q.get('stage')) { state.nanamin.stage = +q.get('stage'); }
    if (q.get('act')) setTimeout(() => interact(q.get('act')), 600);

    updateHud();
    releaseStick();
    $('loading').hidden = true;
    if (state.step === 0) this.time.delayedCall(700, () => toast('Коснись экрана и веди пальцем, чтобы идти', 'info'));
  }

  update(time, dt) {
    let moving = false;
    const v = ui.open ? { x: 0, y: 0 } : inputVector();
    const mag = Math.hypot(v.x, v.y);
    if (mag > 0.05) {
      // скорость зависит от наклона джойстика; полная — с 70% наклона
      const sp = 240 * Math.min(1, mag / 0.7) * Math.min(dt, 50) / 1000;
      const ux = v.x / mag, uy = v.y / mag;
      const nx = player.x + ux * sp, ny = player.y + uy * sp;
      if (Math.abs(ux) > 0.2) facing = ux < 0 ? -1 : 1;
      if (walkable(nx, ny)) { player.setPosition(nx, ny); moving = true; }
      else if (Math.abs(ux) > 0.1 && walkable(nx, player.y)) { player.x = nx; moving = true; }
      else if (Math.abs(uy) > 0.1 && walkable(player.x, ny)) { player.y = ny; moving = true; }
    }

    player.setDepth(player.y);
    player.bodyG.scaleX = facing;
    player.bodyG.y = moving && !REDUCED ? -Math.abs(Math.sin(time / 85)) * 3 : 0;
    this.npcs.forEach((n, i) => { n.bodyG.y = REDUCED ? 0 : Math.sin(time / 500 + i) * 1.2; });
    chickens.forEach(c => c.setDepth(c.y));
    updatePasture(dt);
    updateField();
    updateThorfinn(dt);

    const id = questTarget();
    if (id && id !== nearId) { // когда над целью облачко, «!» прячем
      const a = ANCHORS[id];
      marker.setVisible(true).setPosition(a.x, a.y + a.mark + (REDUCED ? 0 : Math.sin(time / 220) * 5));
    } else marker.setVisible(false);

    updateGuide();
    updateControls();
    saveMs += dt;
    if (saveMs > 2000) { saveMs = 0; save(); }
  }
}

// ===================== Запуск =====================
function boot() {
  const W = app.clientWidth, H = app.clientHeight;
  game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    backgroundColor: '#4F8A3A',
    banner: false,
    input: { activePointers: 1 },
    scale: { mode: Phaser.Scale.NONE, width: Math.round(W * DPR), height: Math.round(H * DPR), zoom: 1 / DPR },
    scene: FarmScene,
  });
  if ('ResizeObserver' in window) new ResizeObserver(resizeGame).observe(app);
  window.addEventListener('resize', resizeGame);
}
const fontsReady = document.fonts
  ? Promise.all([document.fonts.load('800 16px Nunito'), document.fonts.load('600 22px Fredoka')]).catch(() => {})
  : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 1500))]).then(boot);

// Офлайн-режим и установка на телефон (PWA)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
